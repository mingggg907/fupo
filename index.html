  });
  modalRoot.querySelectorAll('[data-toggle]').forEach(cb => {
    cb.addEventListener('change', () => {

    btn.addEventListener('click', () => {

      if(act === 'del'){

        savePatches(); syncPatches(); closeModal(true); openPatchManager();

        const i = patches.findIndex(x => x.id === pid);

}

/* ============================================================
   词典（独立栏目）：像字典一样收录名词
   ============================================================ */
let lexQuery = '';
let lexCat = '';
let lexInitial = '';
let lexLimit = 60;             /* 减压：一次最多渲染这么多条，其余按需载入 */
const LEX_STEP = 60;
/* 词典会越来越大：首页只给索引 + 精简列表，完整词典单独开一屏 */
let lexvQuery = '';
let lexvCat = '';
let lexvInitial = '';
let lexvLimit = 120;
const LEXV_STEP = 120;
const LEX_BIG = 80;            /* 超过这个数量，首页只显示前 30 条 + 入口 */

function lexMatch(x, q){
  if(!q) return true;
  const hay = (x.term + ' ' + x.reading + ' ' + x.aliases + ' ' + x.cat + ' ' + x.def + ' ' + x.note).toLowerCase();
  return hay.indexOf(q.toLowerCase()) >= 0;
}
function lexCats(list){
  return [...new Set(list.map(x => (x.cat || '').trim()).filter(Boolean))].slice(0, 18);
}
/* 字典式首字索引：有拼音读音就用首字母（A–Z），否则用词条首字 */
function lexIndexOf(x){
  const r = String((x && x.reading) || '').trim();
  const m = r.match(/^[A-Za-z]/);
  if(m) return m[0].toUpperCase();
  const t = String((x && x.term) || '').trim();
  return t ? t.charAt(0) : '#';
}
function lexInitials(list){
  const map = new Map();
  list.forEach(x => { const k = lexIndexOf(x); map.set(k, (map.get(k) || 0) + 1); });
  const keys = [...map.keys()].sort((a, b) => {
    const la = /[A-Z]/.test(a), lb = /[A-Z]/.test(b);
    if(la && lb) return a.localeCompare(b);
    if(la) return -1;
    if(lb) return 1;
    return a.localeCompare(b, 'zh');
  });
  return keys.map(k => ({ key: k, n: map.get(k) }));
}
function lexFilter(list, { q, cat, initial }){
  return list.filter(x => lexMatch(x, q || '')
    && (!cat || (x.cat || '').trim() === cat)
    && (!initial || lexIndexOf(x) === initial));
}
function lexIndexHTML(initials, opts){
  const o = opts || {};
  const chips = `<button class="${o.cls || 'lex-ini'}${(!o.cat && !o.initial) ? ' on' : ''}" data-${o.attr}="">全部</button>`
    + initials.map(k => `<button class="${o.cls || 'lex-ini'}${o.initial === k.key ? ' on' : ''}" data-${o.attr}="${esc(k.key)}">${esc(k.key)}<span class="lex-ini-n">${k.n}</span></button>`).join('');
  return `<div class="lex-initials">${chips}</div>`;
}
function lexEntryHTML(x){
  return `<div class="lex-item" data-act="open-lex" data-id="${x.id}">
    <div class="lex-line">
      <span class="lex-term">${esc(x.term || '未命名')}</span>
      ${x.reading ? `<span class="lex-reading">${esc(x.reading)}</span>` : ''}
      ${x.cat ? `<span class="lex-cat">${esc(x.cat)}</span>` : ''}
      ${editMode ? `<span class="lex-acts">
        <button data-act="edit-lex" data-id="${x.id}" title="编辑">✎</button>
        <button data-act="up-lex" data-id="${x.id}" title="上移">↑</button>
        <button data-act="down-lex" data-id="${x.id}" title="下移">↓</button>
        <button data-act="del-lex" data-id="${x.id}" title="删除">✕</button>
      </span>` : ''}
    </div>
    <div class="lex-def">${x.def ? esc(String(x.def).replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\*\*/g, '')) : '<span class="pf-empty">释义完善中</span>'}</div>
    ${x.aliases ? `<div class="lex-alias">别名：${esc(x.aliases)}</div>` : ''}
  </div>`;
}
function lexiconHTML(){
  const all = W().lexicon || [];
  if(!editMode && !all.length) return '';
  const cats = lexCats(all);
  const initials = lexInitials(all);
  const filtered = lexFilter(all, { q: lexQuery, cat: lexCat, initial: lexInitial });
  /* 首页只放少量词条，完整内容进「完整词典」一屏 —— 手机上不用划半天 */
  const inPageCap = (window.innerWidth < 820) ? 5 : 12;
  const cap = (lexCat || lexInitial || lexQuery) ? Math.min(30, lexLimit) : Math.min(inPageCap, lexLimit);
  const shown = filtered.slice(0, cap);
  const rest = Math.max(0, all.length - shown.length);
  return `<section class="sec" id="lexicon">
    <div class="sec-head">
      <h2>${esc(LBL('lexicon', '释名'))}${all.length ? `<span class="sec-count">${all.length} 条</span>` : ''}</h2>
      <div class="sec-tools">
        ${all.length ? `<button class="btn small" data-act="open-lexicon">查 看 全 部</button>` : ''}
        ${editMode ? `<button class="btn small" data-act="add-lex">+ 新增词条</button>` : ''}
      </div>
    </div>
    ${all.length ? `<div class="lex-index">
      ${lexIndexHTML(initials, { attr: 'lex-initial', initial: lexInitial, cat: lexCat })}
      ${cats.length > 1 ? `<div class="lex-cats">
        ${cats.map(c => `<button class="cf-btn${lexCat === c ? ' on' : ''}" data-lex-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>` : ''}
    </div>` : (editMode ? `<div class="lex-tools"><button class="btn small" data-act="lex-seed">从现有设定一键生成词条草稿</button>
      <span class="hint" style="font-family:var(--serif);font-size:.76rem;color:var(--ink-3);letter-spacing:.08em">会把「妖界分区」里每条设定的标题变成词条、分区名变成分类，你再补释义即可</span></div>` : '')}
    <div class="lex-list" id="lex-list">
      ${filtered.length ? shown.map(lexEntryHTML).join('')
        : (all.length ? '<div class="lex-empty">此索引下暂无词条</div>' : wipHTML('词典完善中', true))}
    </div>
    ${(filtered.length > shown.length) ? `<div class="lex-more">
      <button class="btn small" data-act="open-lexicon">查 看 全 部 ${all.length} 条 词 条</button>
      ${(!lexCat && !lexInitial && !lexQuery && all.length > shown.length) ? `<button class="btn small ghost" data-lex-more="1" style="margin-left:8px">继续看下面 ${Math.min(LEX_STEP, filtered.length - shown.length)} 条</button>` : (filtered.length > shown.length ? `<button class="btn small ghost" data-lex-more="1" style="margin-left:8px">载入更多（还有 ${filtered.length - shown.length} 条）</button>` : '')}
    </div>` : `<div class="lex-more"><button class="btn small ghost" data-act="open-lexicon">打 开 完 整 词 典</button></div>`}
  </section>`;
}

async function doDeleteLex(id){
  if(!requireEdit()) return;
  const list = W().lexicon;
  const x = list.find(y => y.id === id);
  if(!x) return;
  const ok = await confirmDelete(x.term || '未命名', '词条 · ' + rl());
  if(!ok) return;
  pushHistory();
  const idx = list.findIndex(y => y.id === id);
  const backup = deep(x);
  list.splice(idx, 1);
  _doSave(); renderAll();
  showUndoToast('已删除词条「' + (x.term || '') + '」', () => { list.splice(idx, 0, backup); _doSave(); renderAll(); });
}

/* 一键从现有设定生成词条草稿：标题→词条、分区名→分类、正文前段→释义 */
function seedLexicon(){
  if(!requireEdit()) return;
  const L = W().lexicon;
  const exists = new Set(L.map(x => String(x.term || '').trim()));
  const add = [];
  (W().sections || []).forEach(sec => {
    (sec.entries || []).forEach(e => {
      const term = String(e.title || '').trim();
      if(!term || term.length < 2 || exists.has(term)) return;
      exists.add(term);
      add.push({
        id: uid(),
        term,
        reading: '',
        cat: String(sec.title || '').trim(),
        aliases: '',
        def: String(e.content || '').replace(/\*\*/g, '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\s+/g, ' ').trim().slice(0, 160),
        note: ''
      });
    });
  });
  (W().characters || []).forEach(c => {
    const term = String(c.name || '').trim();
    if(!term || term.length < 2 || exists.has(term)) return;
    exists.add(term);
    add.push({ id: uid(), term, reading: '', cat: '妖众', aliases: (c.tags || []).join('，'), def: String(c.desc || '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim().slice(0, 160), note: '' });
  });
  if(!add.length){ toast('没有可生成的新词条（可能都已存在）'); return; }
  if(!confirm('将新增 ' + add.length + ' 条词条草稿（标题已填好，释义取自正文前段，之后可逐条修改）。\n\n继续吗？')) return;
  pushHistory();
  add.forEach(x => L.push(x));
  _doSave(); renderAll();
  toast('已生成 ' + add.length + ' 条词条草稿，点词条即可补写释义');
}

const GUEST_TABLE = 'fupo_guest';
const GUEST_LIKE_TABLE = 'fupo_guest_like';
const GUEST_PAGE = 20;
const guestState = { ok: null, rows: [], pending: [], err: '', loaded: false, sent: false, likes: {}, likeOk: null, limit: GUEST_PAGE };

async function loadGuest(force){
  if(!sbConfigured() || !sbReady()){ guestState.ok = null; return; }
  if(guestState.loaded && !force) return;
  try{
    const res = await withTimeout(sb.from(GUEST_TABLE).select('*').order('created_at', { ascending: false }).limit(200), 14000);
    if(res.error) throw res.error;
    const rows = Array.isArray(res.data) ? res.data : [];
    guestState.rows = rows.filter(r => r.approved);
    guestState.pending = rows.filter(r => !r.approved);
    guestState.ok = true; guestState.err = ''; guestState.loaded = true;
    /* 点赞数（表不存在就自动隐藏点赞按钮） */
    try{
      const lk = await withTimeout(sb.from(GUEST_LIKE_TABLE).select('guest_id').limit(5000), 12000);
      if(lk.error) throw lk.error;
      const map = {};
      (lk.data || []).forEach(r => { const k = String(r.guest_id); map[k] = (map[k] || 0) + 1; });
      guestState.likes = map; guestState.likeOk = true;
    }catch(e){ guestState.likeOk = false; }
  }catch(e){
    guestState.ok = false;
    guestState.err = (e && e.message) || String(e);
  }
  try{ renderGuest(); }catch(e){}
}
function guestOn(){ return !!((state.meta && state.meta.guest) || {}).on; }

/* 每日留言次数（本机记录；默认 3 条/天，可在内容工具里改） */
function guestDaily(){
  const today = new Date().toISOString().slice(0, 10);
  let rec = null;
  try{ rec = JSON.parse(localStorage.getItem('fupo-guest-daily') || 'null'); }catch(e){}
  if(!rec || rec.d !== today) rec = { d: today, n: 0 };

  }

          ${r.approved ? '' : '<button class="btn small" data-guest-approve="' + esc(id) + '" type="button">通 过</button>'}
          <button class="btn small ghost" data-guest-edit="${esc(id)}" type="button">编 辑</button>

        </span>` : ''}
      </div>

        ${guestState.likeOk === false ? '' : `<button class="guest-like${liked.has(id) ? ' on' : ''}" data-guest-like="${esc(id)}" type="button" ${liked.has(id) ? 'disabled' : ''}>
          <span class="gl-heart">${liked.has(id) ? '♥' : '♡'}</span>${n}
        </button>`}
        <button class="guest-reply" data-guest-reply="${esc(String(r.name || '').trim() || '匿名')}" type="button">回 复</button>

  return `<div class="guest-bar">
      <button class="gbar${guestSort === 'new' ? ' on' : ''}" data-guest-sort="new" type="button">最 新</button>

function guestHTML(){

async function postGuest(){
  const nameEl = document.getElementById('guest-name');
  const textEl = document.getElementById('guest-text');
  const asOwner = !!sbLoggedIn;                        /* 站主：登录状态下免审核 */
  const name = ((nameEl && nameEl.value) || '').trim().slice(0, 20) || (asOwner ? ownerLabel() : '');
  const text = ((textEl && textEl.value) || '').trim().slice(0, 500);
  if(!text){ toast('请先写点内容'); return; }
  if(!sbReady()){ toast('留言区暂时不可用'); return; }
  /* 每日次数限制（站主不受限） */
  if(!asOwner && guestDailyLeft() <= 0){
    toast('今天的留言次数已用完，明天再来吧');
    return;
  }
  const last = Number(localStorage.getItem('fupo-guest-last') || 0);
  if(Date.now() - last < 30000){ toast('刚刚已经送出了一条，稍后再写吧'); return; }
  showProgress(null, '正在送出…');
  try{
    const payload = { name, text, approved: asOwner };
    if(asOwner && guestState.ownerColOk !== false) payload.is_owner = true;
    /* 注意：访客发的是「待审核」留言，读取权限只放行已通过的留言，
       所以访客这条路绝不能加 .select()（PostgREST 会在 RETURNING 处被 RLS 拒绝）。 */
    let res = asOwner
      ? await withTimeout(sb.from(GUEST_TABLE).insert([payload]).select(), 16000)
      : await withTimeout(sb.from(GUEST_TABLE).insert([payload]), 16000);
    /* is_owner 字段还没建：自动降级重试，不打扰使用者 */
    if(res.error && asOwner && /is_owner|column/i.test(String(res.error.message || ''))){
      guestState.ownerColOk = false;
      delete payload.is_owner;
      res = await withTimeout(sb.from(GUEST_TABLE).insert([payload]).select(), 16000);
    }
    hideProgress();
    if(res.error) throw res.error;
    try{ localStorage.setItem('fupo-guest-last', String(Date.now())); }catch(e){}
    if(!asOwner) guestDailyBump();
    const newId = res.data && res.data[0] && res.data[0].id;
    if(newId) markMine(newId);
    /* 访客读不回自己的待审留言，本地先记一条临时标记，让「我」的标识与计数即时可见 */
    if(!asOwner && !newId){
      try{ const s = myGuestIds(); s.add('local-' + Date.now()); localStorage.setItem('fupo-guest-mine', JSON.stringify([...s].slice(-200))); }catch(e){}
    }
    guestState.sent = true;
    renderGuestForm();
    renderGuest();
    toast(asOwner ? '已发布（站主身份，立即可见）' : '留言已送达 · 作者看过后会显示出来');
    loadGuest(true);
  }catch(e){
    hideProgress();

async function modGuest(id, approve){
  if(!requireEdit()) return;
  /* 审核需要「已登录云同步」：未登录时服务端会拒绝（RLS 只允许登录用户改） */
  if(!sbLoggedIn){
    toast('请先登录云同步，才能审核留言');
    setTimeout(() => { try{ openCloudSettings(); }catch(e){} }, 400);
    return;
  }
  try{
    const res = approve
      ? await withTimeout(sb.from(GUEST_TABLE).update({ approved: true }).eq('id', id), 14000)
      : await withTimeout(sb.from(GUEST_TABLE).delete().eq('id', id), 14000);
    if(res.error) throw res.error;
    /* 本地立即生效（不等重新拉取），再后台刷新一次保持一致 */
    if(approve){
      const row = guestState.pending.find(r => String(r.id) === String(id));
      if(row){ row.approved = true; guestState.pending = guestState.pending.filter(r => String(r.id) !== String(id)); guestState.rows.unshift(row); }
    }else{
      guestState.pending = guestState.pending.filter(r => String(r.id) !== String(id));
      guestState.rows = guestState.rows.filter(r => String(r.id) !== String(id));
    }
    renderGuest();
    toast(approve ? '已通过 · 访客现在能看到这条' : '已删除');
    loadGuest(true);
  }catch(e){
    toast('操作失败：' + ((e && e.message) ? e.message.slice(0, 40) : '请检查网络或登录状态'));
  }
}

function linkTerms(html){
  const chars = (W().characters || []).filter(c => c && c.name && String(c.name).length >= 2);
  const terms = (W().lexicon || []).filter(x => x && x.term && String(x.term).length >= 2);
  if(!chars.length && !terms.length) return html;
  return String(html).split(/(<[^>]+>)/).map(part => {
    if(!part || part.charAt(0) === '<') return part;
    chars.forEach(c => {
      const name = String(c.name);
      if(part.indexOf(name) < 0) return;
      part = part.split(name).join(`<button class="name-link" data-act="open-character" data-id="${esc(c.id)}">${esc(name)}</button>`);
    });
    terms.forEach(x => {
      const t = String(x.term);
      if(part.indexOf(t) < 0) return;
      part = part.split(t).join(`<button class="name-link lex-link" data-act="open-lex" data-id="${esc(x.id)}">${esc(t)}</button>`);
    });
    return part;
  }).join('');
}

/* 重渲染时保住输入框内容与焦点（避免正在打字时被云端刷新清掉） */
function captureInputs(){
  const snap = { fields: {}, focusId: '' };
  try{
    document.querySelectorAll('#app input, #app textarea').forEach(el => {
      if(!el.id) return;
      snap.fields[el.id] = { v: el.value, sel: el.selectionStart, dirty: el.value.length > 0 };
    });
    const a = document.activeElement;
    if(a && a.id && a.closest && a.closest('#app')) snap.focusId = a.id;
  }catch(e){}
  return snap;
}
function restoreInputs(snap){
  if(!snap) return;
  try{
    Object.keys(snap.fields || {}).forEach(id => {
      const el = document.getElementById(id);
      if(!el) return;
      const rec = snap.fields[id];
      if(rec.v && el.value !== rec.v){
        el.value = rec.v;
        try{ if(rec.sel != null) el.setSelectionRange(rec.sel, rec.sel); }catch(e){}
      }
    });
    if(snap.focusId){
      const el = document.getElementById(snap.focusId);
      if(el && document.activeElement !== el){
        const atEnd = el.tagName === 'TEXTAREA';
        el.focus({ preventScroll: true });
        try{ if(atEnd){ const n = el.value.length; el.setSelectionRange(n, n); } }catch(e){}
      }
    }
  }catch(e){}
}

let richIO = null;
function bindRichImgReveal(){
  if(richIO) richIO.disconnect();
  const targets = document.querySelectorAll('.rich-img');
  if(!targets.length) return;
  const show = el => {
    const img = el.querySelector('img');
    if(!img || (img.complete && img.naturalWidth > 0)) el.classList.add('in');
    else{ img.addEventListener('load', () => el.classList.add('in'), { once:true }); img.addEventListener('error', () => el.classList.add('in'), { once:true }); }
  };
  if(!('IntersectionObserver' in window)){ targets.forEach(show); return; }
  richIO = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting){ show(en.target); richIO.unobserve(en.target); } });
  }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
  targets.forEach(el => richIO.observe(el));
}

/* ============================================================
   关系网（按当前界面的人物）
   ============================================================ */
const GRAPH_W = 680, GRAPH_H = 460;
let graphWinHandlers = null;
function clearGraphWinHandlers(){
  if(!graphWinHandlers) return;
  window.removeEventListener('mousemove', graphWinHandlers.move);
  window.removeEventListener('touchmove', graphWinHandlers.move);
  window.removeEventListener('mouseup', graphWinHandlers.up);
  window.removeEventListener('touchend', graphWinHandlers.up);
  graphWinHandlers = null;
}
function renderRelationGraph(){
  const wrap = document.getElementById('relation-graph');
  if(!wrap) return;
  clearGraphWinHandlers();
  const chars = W().characters;
  if(!chars.length){ wrap.innerHTML = ''; return; }
  const cx = GRAPH_W / 2, cy = GRAPH_H / 2;
  const R = Math.min(GRAPH_W, GRAPH_H) * 0.31;
  chars.forEach((c, i) => {
    if(typeof c._x !== 'number' || typeof c._y !== 'number'){
      if(chars.length === 1){ c._x = cx; c._y = cy; }
      else{
        const a = (i / chars.length) * Math.PI * 2 - Math.PI / 2;
        c._x = cx + R * Math.cos(a);
        c._y = cy + R * Math.sin(a);
      }
    }
  });
  /* 有向关系：A→B 与 B→A 各画一条（带箭头），同一方向的多条关系合并标签 */
  const dirMap = {};
  chars.forEach(c => {
    (c.relations || []).forEach(r => {
      const t = chars.find(x => x.id === r.target);
      if(!t || t.id === c.id) return;
      const key = c.id + '|' + t.id;
      if(!dirMap[key]) dirMap[key] = { from: c, to: t, labels: [] };
      const lab = String(r.label || '').trim();
      if(lab && dirMap[key].labels.indexOf(lab) < 0) dirMap[key].labels.push(lab);
    });
  });
  const lines = Object.keys(dirMap).map(function(k){
    const d = dirMap[k];
    return { from: d.from, to: d.to, label: d.labels.join(' · '), reverse: !!dirMap[d.to.id + '|' + d.from.id] };
  });
  const clipId = 'avatarClip_' + uid();
  let svg = `<svg class="relation-svg" viewBox="0 0 ${GRAPH_W} ${GRAPH_H}" preserveAspectRatio="xMidYMid meet">`;
  svg += '<defs><clipPath id="' + clipId + '"><circle r="26" cx="0" cy="0"/></clipPath>'
    + '<marker id="relArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'
    + '<path class="rel-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  lines.forEach(l => {
    const hue = String(l.label || '').split('').reduce((a, ch) => a + ch.charCodeAt(0), 0) % 360;
    const lc = l.label ? 'hsl(' + hue + ' 40% 52%)' : '';
    const dx = l.to._x - l.from._x, dy = l.to._y - l.from._y;
    const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    /* 双向时各自垂直偏移 7px，避免两条线重叠 */
    const off = l.reverse ? 7 : 0;
    const ox = (-dy / len) * off, oy = (dx / len) * off;
    /* 两端各留出一点，让箭头不被头像盖住 */
    const pad = 30;
    const x1 = l.from._x + (dx / len) * pad + ox, y1 = l.from._y + (dy / len) * pad + oy;
    const x2 = l.to._x - (dx / len) * pad + ox, y2 = l.to._y - (dy / len) * pad + oy;
    svg += '<line class="rel-line" data-a="' + l.from.id + '" data-b="' + l.to.id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" marker-end="url(#relArrow)"'
      + (lc ? ' style="stroke:' + lc + '"' : '') + '/>';
    if(l.label){
      const mx = (x1 + x2) / 2 + ox * 1.4, my = (y1 + y2) / 2 + oy * 1.4;
      svg += '<text class="rel-label" data-a="' + l.from.id + '" data-b="' + l.to.id + '" x="' + mx + '" y="' + my + '" text-anchor="middle">' + esc(l.label) + '</text>';
    }
  });
  chars.forEach(c => {
    const name = esc(c.name || '？');
    const initial = esc((c.name || '？').slice(0, 1));
    svg += `<g class="rel-node" data-id="${c.id}" transform="translate(${c._x},${c._y})" style="--nc:${esc(charAccent(c))}">
      <circle r="30"/>
      ${c.avatar
        ? `<image href="${esc(c.avatar)}" x="-26" y="-26" width="52" height="52" clip-path="url(#${clipId})" preserveAspectRatio="xMidYMid slice"/>`
        : `<text class="rel-node-char" text-anchor="middle" dy=".35em">${initial}</text>`}
      <text class="rel-node-name" y="50" text-anchor="middle">${name}</text>
    </g>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
  bindGraphEvents(wrap.querySelector('svg'));
}
function bindGraphEvents(svg){
  if(!svg) return;
  const chars = W().characters;
  svg.querySelectorAll('.rel-node').forEach(node => {
    const id = node.dataset.id;
    node.addEventListener('mouseenter', () => {
      svg.querySelectorAll('.rel-line').forEach(l => l.classList.toggle('active', l.dataset.a === id || l.dataset.b === id));
      svg.querySelectorAll('.rel-label').forEach(l => l.classList.toggle('active', l.dataset.a === id || l.dataset.b === id));
    });
    node.addEventListener('mouseleave', () => svg.querySelectorAll('.rel-line, .rel-label').forEach(l => l.classList.remove('active')));
    node.addEventListener('click', () => { if(node._dragged){ node._dragged = false; return; } openCharacter(id); });
  });
  const getPt = e => {
    const pt = svg.createSVGPoint();
    pt.x = e.touches ? e.touches[0].clientX : e.clientX;
    pt.y = e.touches ? e.touches[0].clientY : e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  let active = null;
  svg.querySelectorAll('.rel-node').forEach(node => {
    const id = node.dataset.id;
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    const down = e => {
      const c = chars.find(x => x.id === id);
      if(!c) return;
      dragging = true; node._dragged = false;
      svg.classList.add('dragging');
      const p = getPt(e);
      sx = p.x; sy = p.y; ox = c._x; oy = c._y;
      active = { node };
      e.preventDefault();
    };
    const move = e => {
      if(!dragging || !node.isConnected) return;
      const p = getPt(e);
      const c = chars.find(x => x.id === id);
      if(!c) return;
      const dx = p.x - sx, dy = p.y - sy;
      if(Math.abs(dx) + Math.abs(dy) > 3) node._dragged = true;
      c._x = Math.max(40, Math.min(GRAPH_W - 40, ox + dx));
      c._y = Math.max(40, Math.min(GRAPH_H - 40, oy + dy));
      updateGraphPositions(svg);
      e.preventDefault();
    };
    const up = () => { if(!dragging) return; dragging = false; svg.classList.remove('dragging'); _doSave(); };
    node.addEventListener('mousedown', down);
    node.addEventListener('touchstart', down, { passive: false });
    node.__move = move;
    node.__up = up;
  });
  if(!graphWinHandlers){
    const wMove = e => { if(active && active.node && active.node.__move) active.node.__move(e); };
    const wUp = () => { svg.querySelectorAll('.rel-node').forEach(n => { if(n.__up) n.__up(); }); };
    graphWinHandlers = { move: wMove, up: wUp };
    window.addEventListener('mousemove', wMove);
    window.addEventListener('touchmove', wMove, { passive:false });
    window.addEventListener('mouseup', wUp);
    window.addEventListener('touchend', wUp);
  }
}
function updateGraphPositions(svg){
  const chars = W().characters;
  svg.querySelectorAll('.rel-node').forEach(node => {
    const c = chars.find(x => x.id === node.dataset.id);
    if(c) node.setAttribute('transform', `translate(${c._x},${c._y})`);
  });
  svg.querySelectorAll('.rel-line').forEach(l => {
    const a = chars.find(x => x.id === l.dataset.a);
    const b = chars.find(x => x.id === l.dataset.b);
    if(a && b){
      l.setAttribute('x1', a._x); l.setAttribute('y1', a._y);
      l.setAttribute('x2', b._x); l.setAttribute('y2', b._y);
    }
  });
  svg.querySelectorAll('.rel-label').forEach(t => {
    const a = chars.find(x => x.id === t.dataset.a);
    const b = chars.find(x => x.id === t.dataset.b);
    if(a && b){
      t.setAttribute('x', (a._x + b._x) / 2);
      t.setAttribute('y', (a._y + b._y) / 2);
    }
  });
}

function onKeydown(e){

/* ★ 每个文字框都带「插入图片」按钮 + 拖拽插图 */
/* 图片统一入口：登录状态下先上传云端，返回公开链接；失败才退回 base64（保证不丢图） */
async function imageUrlFor(file){
  const dataUrl = await compressImage(file);
  if(!(sbConfigured() && sbLoggedIn)) return dataUrl;
  const name = String(file.name || 'image').replace(/\.[^.]+$/, '');
  showProgress(null, '正在上传图片到云端…');
  let url = null;
  try{ url = await uploadDataUrl(dataUrl, name); }catch(e){ url = null; }
  hideProgress();
  if(url){ toast('图片已存入云端 ✅'); return url; }
  toast('图片上传云端失败，已改为内嵌保存（能正常显示，但会让同步变慢）');
  return dataUrl;
}
async function imageMarkdownFor(file){
  /* 文件名做安全处理：去掉会破坏 markdown 的字符 */
  const name = String(file.name || 'image').replace(/\.[^.]+$/, '').replace(/[\[\]()"']/g, '_').slice(0, 60) || 'image';
  const src = await imageUrlFor(file);
  return `![${name}](${src})`;
}
async function insertImageAtCursor(ta, file){
  if(!file || !String(file.type || '').startsWith('image/')) return;
  const md = await imageMarkdownFor(file);
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const insert = (before && !before.endsWith('\n') ? '\n\n' : '') + md + (after && !after.startsWith('\n') ? '\n\n' : '');
  ta.value = before + insert + after;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + insert.length;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
function bindModalTextareas(){
  modalRoot.querySelectorAll('textarea').forEach(ta => {
    if(ta.dataset.toolBound) return;
    ta.dataset.toolBound = '1';
    ta.addEventListener('dragover', e => { e.preventDefault(); ta.style.borderColor = 'var(--cinnabar)'; });
    ta.addEventListener('dragleave', () => { ta.style.borderColor = ''; });
    ta.addEventListener('drop', e => {
      e.preventDefault();
      ta.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if(!file || !file.type.startsWith('image/')) return;
      insertImageAtCursor(ta, file);
    });
    if(ta.dataset.noImg === '1') return;
    const lbl = document.createElement('label');
    lbl.className = 'insert-img-btn';
    lbl.textContent = '🖼 插入图片';
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
    lbl.appendChild(inp);
    ta.insertAdjacentElement('afterend', lbl);
    inp.addEventListener('change', () => {
      const f = inp.files[0];
      if(!f || !f.type.startsWith('image/')) return;
      insertImageAtCursor(ta, f);
      inp.value = '';
    });
  });
}

      const r = onOk && onOk();
      if(r === false) return;
      /* 异步保存期间禁用按钮，防止连点造成重复保存 */
      okBtn.disabled = true;
      const finish = () => { okBtn.disabled = false; };
      if(r && typeof r.then === 'function'){
        r.then(ok => { finish(); if(ok !== false) closeModal(true); }).catch(() => finish());
        return;
      }
      finish();
      closeModal(true);
    }
  });
  document.addEventListener('keydown', onKeydown);
  const first = modalRoot.querySelector('input, textarea');
  if(first) setTimeout(() => first.focus(), 80);
  bindRichImgRevealInModal();
  setTimeout(() => {
    modalRoot.querySelectorAll('input[type=text], input[type=url], textarea').forEach(el => {
      el.dataset.original = el.value;
    });
  }, 60);
  setTimeout(bindModalTextareas, 100);
}
function bindRichImgRevealInModal(){
  const targets = modalRoot.querySelectorAll('.rich-img');
  if(!targets.length) return;
  const show = el => {
    const img = el.querySelector('img');
    if(!img || (img.complete && img.naturalWidth > 0)) el.classList.add('in');
    else{ img.addEventListener('load', () => el.classList.add('in'), { once:true }); img.addEventListener('error', () => el.classList.add('in'), { once:true }); }
  };
  if(!('IntersectionObserver' in window)){ targets.forEach(show); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting){ show(en.target); io.unobserve(en.target); } });
  }, { threshold: 0.05 });
  targets.forEach(el => io.observe(el));
}

/* ============================================================
   智能图片压缩（上传图片自动压小）
   ============================================================ */
function compressImage(file){
  return new Promise(resolve => {
    const KB = 1024, size = file.size;
    const passthrough = v => {
      const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.readAsDataURL(v);
    };
    if(size < 400 * KB) return passthrough(file);
    if(file.type === 'image/gif' || file.type === 'image/svg+xml') return passthrough(file);
    const maxSize = size < 1500 * KB ? 1800 : 1600;
    const quality = size < 1500 * KB ? 0.9 : 0.85;
    const isPNG = file.type === 'image/png';
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        let needResize = false;
        if(width > maxSize || height > maxSize){
          needResize = true;
          if(width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
          else{ width = Math.round(width * maxSize / height); height = maxSize; }
        }
        if(!needResize && size < 900 * KB){ resolve(fr.result); return; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        const out = isPNG ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality);
        if(out.length > fr.result.length) resolve(fr.result);
        else resolve(out);
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function bindSectionFormEvents(updateBtns){
  modalRoot.querySelector('#add-entry-btn')?.addEventListener('click', () => {
    const list = modalRoot.querySelector('#entries-list');
    const div = document.createElement('div');
    div.className = 'entry-edit';
    div.innerHTML = `<div class="entry-edit-head">
      <input type="text" class="e-title" placeholder="子条目标题">
      <div class="entry-edit-actions">
        <button type="button" data-eact="up">↑</button>
        <button type="button" data-eact="down">↓</button>
        <button type="button" data-eact="del">✕</button>
      </div>
    </div>
    <label class="mini">检索关键词（逗号分隔）</label>
    <input type="text" class="e-kw kw" placeholder="货币, 钱, 泉币">
    <label class="mini">正文（支持 **加粗**，点下方按钮插图）</label>
    <textarea class="e-content" rows="6"></textarea>`;
    list.appendChild(div);
    if(updateBtns) updateBtns();
    bindModalTextareas();
  });
  modalRoot.querySelector('#entries-list')?.addEventListener('click', e => {
    const btn = e.target.closest('[data-eact]');
    if(!btn) return;
    const act = btn.dataset.eact;
    const item = btn.closest('.entry-edit');
    const list = modalRoot.querySelector('#entries-list');
    if(act === 'del') item.remove();
    else if(act === 'up'){ const prev = item.previousElementSibling; if(prev) list.insertBefore(item, prev); }
    else if(act === 'down'){ const next = item.nextElementSibling; if(next) list.insertBefore(next, item); }
    if(updateBtns) updateBtns();
  });
}
function updateSectionBtns(){
  const items = modalRoot.querySelectorAll('.entry-edit');
  items.forEach((el, i) => {
    const up = el.querySelector('[data-eact="up"]');
    const dn = el.querySelector('[data-eact="down"]');
    if(up) up.disabled = (i === 0);
    if(dn) dn.disabled = (i === items.length - 1);
  });
}
function openSectionEditor(id, isNew){
  if(!requireEdit()) return;
  const list = W().sections;
  const s = isNew ? null : list.find(x => x.id === id);
  if(!isNew && !s) return;
  showModal({
    title: (isNew ? '新 增 大 分 区' : '编 辑 大 分 区') + '（' + rl() + '）', wide: true,
    body: realmHint() + sectionForm(s),
    onOk(){
      const get = k => modalRoot.querySelector(`[data-field="${k}"] input`)?.value.trim() || '';
      const icon = get('icon'), title = get('title'), keywords = get('keywords');
      if(!title){ toast('请填写大分区标题'); return false; }
      const entries = [];
      modalRoot.querySelectorAll('.entry-edit').forEach(el => {
        const t = el.querySelector('.e-title').value.trim();
        const kw = el.querySelector('.e-kw').value.trim();
        const c = el.querySelector('.e-content').value;
        if(t || c){
          entries.push({ id: el.dataset.entryId || uid(), title: t || '未命名', keywords: kw, content: c });
        }
      });
      if(isNew) list.push({ id: uid(), icon: icon || '✦', title, keywords, entries });
      else{ s.icon = icon || '✦'; s.title = title; s.keywords = keywords; s.entries = entries; }
      save(); renderAll(); toast('已 保 存（' + rl() + '）');
    }
  });
  bindSectionFormEvents(updateSectionBtns);
}
function openEntryEditor(sid, eid){

async function doDeleteSection(id){
  if(!requireEdit()) return;
  const list = W().sections;
  const s = list.find(x => x.id === id);
  if(!s) return;
  const ok = await confirmDelete(s.title + '（大分区 · ' + rl() + '）', `包含 ${(s.entries||[]).length} 条子条目，一起删除。只影响「${rl()}」，另一边不受影响`);
  if(!ok) return;
  pushHistory();
  const backup = deep(s);
  const idx = list.findIndex(x => x.id === id);
  list.splice(idx, 1);
  _doSave(); renderAll();
  showUndoToast('已删除「' + s.title + '」（' + rl() + '）', () => {
    list.splice(idx, 0, backup);
    _doSave(); renderAll();
  });
}
async function doDeleteEntry(sid, eid){
  if(!requireEdit()) return;
  const s = W().sections.find(x => x.id === sid);
  if(!s) return;
  const e = s.entries.find(x => x.id === eid);
  if(!e) return;
  const ok = await confirmDelete(e.title, '子条目 · ' + s.title + '（' + rl() + '）');
  if(!ok) return;
  pushHistory();
  const backup = deep(e);
  const idx = s.entries.findIndex(x => x.id === eid);
  s.entries.splice(idx, 1);
  _doSave(); renderAll();
  showUndoToast('已删除「' + e.title + '」', () => {
    s.entries.splice(idx, 0, backup);
    _doSave(); renderAll();
  });
}
async function doDeleteArr(key, id){
  if(!requireEdit()) return;
  const arr = W()[key];
  const item = arr.find(x => x.id === id);
  if(!item) return;
  const labelMap = { characters:'name', timeline:'title', stories:'title' };
  const label = item[labelMap[key]] || '未命名';
  const typeName = { characters:'角色', timeline:'事件', stories:'故事' }[key];
  const ok = await confirmDelete(label, typeName + ' · ' + rl() + '（只影响' + rl() + '）');
  if(!ok) return;
  pushHistory();
  const backup = deep(item);
  const idx = arr.findIndex(x => x.id === id);
  arr.splice(idx, 1);
  _doSave(); renderAll();
  showUndoToast('已删除「' + label + '」', () => {
    arr.splice(idx, 0, backup);
    _doSave(); renderAll();
  });
}
function moveEntry(sid, eid, dir){
  if(!requireEdit()) return;
  const s = W().sections.find(x => x.id === sid);
  if(!s) return;
  const arr = s.entries;
  const i = arr.findIndex(x => x.id === eid);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= arr.length) return;
  pushHistory();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  _doSave(); renderAll();
}
function moveArr(key, id, dir){

  pushHistory();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  _doSave(); renderAll();
}

const STOP_WORDS = ['是什么','什么是','在哪里','在哪','如何','怎么','怎样','请问','告诉','给我','帮我','这个','那个','一下','关于','介绍','讲讲','说说','能否','可以','有没有','哪些','哪个','为什么','多少','时候','哪里','什么','哪','谁','的','吗','呢','啊','了','是','有','和','与','及','请','问','个','我','你','他','她','它','们','这','那','着','过','会','要','能'];
function extractTerms(q){
  let s = String(q || '').toLowerCase();
  s = s.replace(/[？?！!。，,、；;：:""''「」『』（）()\[\]【】<>《》~·\s]+/g, ' ');
  [...STOP_WORDS].sort((a,b)=>b.length-a.length).forEach(w => { s = s.split(w).join(' '); });
  const raw = s.split(/\s+/).filter(Boolean);
  const terms = new Set();
  raw.forEach(w => {
    terms.add(w);
    if(w.length >= 3 && /^[\u4e00-\u9fa5]+$/.test(w)){
      for(let i=0;i<w.length-1;i++) terms.add(w.slice(i, i+2));
    }
  });
  return Array.from(terms).filter(t => t.length >= 1);
}
function buildIndex(){
  const items = [];
  W().sections.forEach(s => {
    (s.entries || []).forEach(e => {
      items.push({
        type:'section', sectionId: s.id, entryId: e.id,
        sectionTitle: s.title, entryTitle: e.title, title: e.title,
        text: e.content || '',
        keywords: [s.keywords || '', e.keywords || '', s.title, e.title].join(' ')
      });
    });
  });
  if(document.getElementById('search-all')?.checked){
    W().characters.forEach(c => {
      items.push({ type:'character', sectionId:'chars', entryId:c.id,
        sectionTitle:'妖众', entryTitle:c.name, title:c.name,
        text: (c.desc || '') + ' ' + (c.tags||[]).join(' '), keywords: c.keywords || '' });
    });
    W().timeline.forEach(t => {
      items.push({ type:'timeline', sectionId:'timeline', entryId:t.id,
        sectionTitle:'纪年', entryTitle:t.title, title:t.title,
        text: t.desc || '', keywords: t.keywords || '' });
    });
    W().stories.forEach(s => {
      items.push({ type:'story', sectionId:'stories', entryId:s.id,
        sectionTitle:'卷帙', entryTitle:s.title, title:s.title,
        text: (s.summary||'') + ' ' + (s.content||''), keywords: s.keywords || '' });
    });
    (W().lexicon || []).forEach(x => {
      items.push({ type:'lex', sectionId:'lexicon', entryId:x.id,
        sectionTitle: LBL('lexicon','词典'), entryTitle:x.term, title:x.term,
        text: (x.def || '') + ' ' + (x.note || '') + ' ' + (x.aliases || ''), keywords: [x.cat||'', x.reading||'', x.aliases||''].join(' ') });
    });
  }
  return items;
}
function scoreItem(item, terms, q){
  const title = (item.title || '').toLowerCase();
  const text = (item.text || '').toLowerCase();
  const kw = (item.keywords || '').toLowerCase();
  let score = 0;
  const ql = String(q || '').toLowerCase();
  if(ql && ql.length >= 2){
    if(kw.includes(ql)) score += 80;
    if(title.includes(ql)) score += 60;
    if(text.includes(ql)) score += 45;
  }
  terms.forEach(t => {
    if(!t) return;
    const w = t.length >= 2 ? 1 : 0.35;
    let cnt = 0, idx = kw.indexOf(t);
    while(idx > -1 && cnt < 4){ cnt++; idx = kw.indexOf(t, idx + 1); }
    score += cnt * 12 * w;
    if(title.includes(t)) score += 10 * w;
    cnt = 0; idx = text.indexOf(t);
    while(idx > -1 && cnt < 8){ cnt++; idx = text.indexOf(t, idx + 1); }
    score += cnt * 2.5 * w;
  });
  return score;
}
function makeSnippet(text, q, terms){
  if(!text) return '';
  const t = text.replace(/!\[(.*?)\]\((.*?)\)/g, '$1').replace(/\n+/g, ' ').trim();
  const lower = t.toLowerCase();
  const ql = String(q || '').toLowerCase();
  let pos = -1;
  if(ql && ql.length >= 2) pos = lower.indexOf(ql);
  if(pos < 0){
    [...terms].sort((a,b)=>b.length-a.length).forEach(tm => {
      if(pos > -1) return;
      pos = lower.indexOf(tm);
    });
  }
  if(pos < 0) return t.slice(0, 90) + (t.length > 90 ? '…' : '');
  const start = Math.max(0, pos - 28);
  const end = Math.min(t.length, pos + 78);
  return (start > 0 ? '…' : '') + t.slice(start, end) + (end < t.length ? '…' : '');
}
function highlight(text, terms, q){
  const all = Array.from(new Set([...terms, q].filter(Boolean))).filter(t => t.length >= 1);
  if(!all.length) return esc(text);
  all.sort((a,b)=>b.length-a.length);
  const pattern = all.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  let re; try{ re = new RegExp(pattern, 'gi'); }catch(e){ return esc(text); }
  let result = '', last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) result += esc(text.slice(last, m.index));
    result += '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
    if(m[0].length === 0) re.lastIndex++;
  }
  if(last < text.length) result += esc(text.slice(last));
  return result;
}
const searchPanel = document.getElementById('search-panel');

function performSearch(query){
  const q = String(query || '').trim();
  if(!q){ searchHint.style.display = ''; searchResults.innerHTML = ''; return; }
  searchHint.style.display = 'none';
  const terms = extractTerms(q);
  const items = buildIndex();
  const scored = items.map(item => ({ item, score: scoreItem(item, terms, q) }))
    .filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, 12);
  if(!scored.length){
    searchResults.innerHTML = `<div class="search-empty">未 找 到 相 关 内 容（当前搜索范围：${rl()}）</div>`;
    return;
  }
  searchResults.innerHTML = scored.map(({ item }) => {
    const sn = makeSnippet(item.text, q, terms);
    return `<button class="result-item" data-sid="${esc(item.sectionId)}" data-eid="${esc(item.entryId)}" data-type="${esc(item.type)}">
      <div class="result-head">
        <span class="result-type">${esc(item.sectionTitle)}</span>
        <span class="result-title">${esc(item.entryTitle)}</span>
      </div>
      <div class="result-snippet">${highlight(sn, terms, q)}</div>
    </button>`;
  }).join('');
}

searchInput.addEventListener('input', e => {
  /* 减压：输入防抖，避免每敲一个字就全量扫描一遍内容 */
  const v = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => performSearch(v), 140);
});
searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); searchResults.querySelector('.result-item')?.click(); }
});
searchResults.addEventListener('click', e => {
  const btn = e.target.closest('.result-item');
  if(!btn) return;
  const sid = btn.dataset.sid, eid = btn.dataset.eid, type = btn.dataset.type;
  if(type === 'character'){ closeSearch(); setTimeout(() => openCharacter(eid), 200); }
  else if(type === 'timeline'){ closeSearch(); setTimeout(() => openTimeline(eid), 200); }
  else if(type === 'story'){ closeSearch(); setTimeout(() => openStory(eid), 200); }
  else if(type === 'lex'){ closeSearch(); setTimeout(() => openLex(eid), 200); }
  else jumpToSection(sid, eid);
});
searchHint.addEventListener('click', e => {
  const chip = e.target.closest('[data-q]');
  if(!chip) return;
  searchInput.value = chip.dataset.q;
  performSearch(chip.dataset.q);
});
document.getElementById('search-all').addEventListener('change', () => {
  if(searchInput.value.trim()) performSearch(searchInput.value);
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); openSearch(); }
  if(e.key === 'Escape' && searchPanel.classList.contains('open')) closeSearch();
});

/* ============================================================
   口令（输入一次后 15 分钟内免密）
   ============================================================ */
function editUnlocked(){
  return Date.now() < Number(localStorage.getItem(EDIT_SESSION_KEY) || 0);
}
function grantEditSession(){
  localStorage.setItem(EDIT_SESSION_KEY, String(Date.now() + EDIT_SESSION_MIN * 60000));
}
function enterEdit(fromSession){
  editMode = true;
  renderAll();
  if(fromSession) toast('编辑已开启 · ' + EDIT_SESSION_MIN + ' 分钟内免密');
  else toast('已 进 入 编 辑 模 式 · ' + EDIT_SESSION_MIN + ' 分钟内免密');
  if(!localStorage.getItem('fupo-guide-seen')){
    localStorage.setItem('fupo-guide-seen', '1');
    setTimeout(openHelp, 600);
  }
}
function askPassword(){
  if(editUnlocked()){ enterEdit(true); return; }
  const now = Date.now();
  const lockUntil = Number(localStorage.getItem('fupo-lock-until') || 0);
  if(now < lockUntil){
    const sec = Math.ceil((lockUntil - now) / 1000);
    toast('已 锁 定，请 ' + sec + ' 秒 后 再 试');
    return;
  }
  showModal({
    title: '输 入 编 辑 口 令',
    body: `<div class="form">
      <div class="field full">
        <label>编辑口令</label>
        <input type="password" id="pass-input" placeholder="请输入口令" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go">
        <span class="hint">口令正确后进入编辑模式；${EDIT_SESSION_MIN} 分钟内再点「编辑」不需要重新输入（刷新页面也有效）。连续错误 3 次将锁定 1 分钟。</span>
      </div>
    </div>`,
    okText: '进 入',
    onOk(){
      const v = modalRoot.querySelector('#pass-input').value;
      if(v === EDIT_PASS){
        localStorage.setItem('fupo-fail-count', '0');
        grantEditSession();
        enterEdit(false);
      }else{
        const cnt = Number(localStorage.getItem('fupo-fail-count') || 0) + 1;
        localStorage.setItem('fupo-fail-count', cnt);
        if(cnt >= 3){
          localStorage.setItem('fupo-lock-until', Date.now() + 60000);
          localStorage.setItem('fupo-fail-count', '0');
          toast('错 误 3 次，锁 定 1 分 钟');
        }else{
          toast('口 令 错 误（' + cnt + '/3）');
        }
        return false;
      }
    }
  });
}

  });
  document.getElementById('sb-save-config').addEventListener('click', async () => {
    const u = document.getElementById('sb-url-input').value.trim();
    const t = document.getElementById('sb-table-input').value.trim() || 'fupo_state';
    const bk = (document.getElementById('sb-bucket-input').value.trim() || 'fupo-audio');
    const em = document.getElementById('sb-email-input').value.trim();
    localStorage.setItem(SB_URL_KEY, u);
    localStorage.setItem(SB_TABLE_KEY, t);
    localStorage.setItem('fupo-sb-bucket', bk);
    if(em) localStorage.setItem('fupo-sb-email', em);
    reinitCloud();
    closeModal(true);
    /* 「保存配置」只保存这些设置并测试连接，绝不改动页面内容、也不上传 */
    if(!sbConfigured()){ toast('地址格式不对：请填写 https:// 开头的完整地址'); return; }
    const cloud = await cloudLoad();
    if(cloud.ok){
      if(cloud.updatedAt) lastCloudStamp = cloud.updatedAt;
      const has = !!(cloud.state && cloud.state.meta && cloud.state.worlds);
      toast(has ? '配置已保存 · 云端连接正常（页面内容未改动）' : '配置已保存 · 云端还没有内容，下次保存就会上传');
    }else{
      toast('配置已保存，但连不上云端（检查网络或表名）');
    }
  });
  document.getElementById('sb-login').addEventListener('click', async () => {
    const em = document.getElementById('sb-email-input').value.trim();
    const pw = document.getElementById('sb-pass-input').value;
    const stateEl = document.getElementById('sb-login-state');
    if(!em || !pw){ toast('请填写邮箱和密码'); return; }
    localStorage.setItem('fupo-sb-email', em);
    const btn = document.getElementById('sb-login');
    btn.textContent = '登录中…';
    const r = await loginCloud(em, pw);
    btn.textContent = '登 录';
    if(r && r.error){
      const m = String(r.error.message || '');
      let tip = m;
      if(/Invalid login credentials/i.test(m)) tip = '邮箱或密码不对。请确认已在 Supabase → Authentication → Users 建过这个邮箱的账号，且密码完全一致；最省事的办法是在那里把这个用户删掉，重新建一个（Auto Confirm User 打开），密码设简单点';
      else if(/Email not confirmed/i.test(m)) tip = '这个账号还没确认邮箱：到 Users 里点开它 → Confirm email，或删掉重建时打开 Auto Confirm User';
      else if(/Failed to fetch|NetworkError|network/i.test(m)) tip = '连不上 Supabase（网络问题），换手机流量或换个网络再试';
      toast('登录失败：' + tip);
      if(stateEl) stateEl.textContent = '当前状态：未登录';
    }else{
      /* 记住密码（可选）：勾选后这台设备以后自动登录 */
      try{
        const remember = document.getElementById('sb-remember');
        if(remember && remember.checked){
          localStorage.setItem('fupo-sb-remember', '1');
          localStorage.setItem('fupo-sb-pass', btoa(unescape(encodeURIComponent(pw))));
        }else{
          localStorage.removeItem('fupo-sb-remember');
          localStorage.removeItem('fupo-sb-pass');
        }
      }catch(e){}
      const u = await cloudUser();
      const d = loadDraft();
      if(d && d.state){
        /* 本机有未上传的修改：登录成功后自动把它传上去（这是你最想要的结果） */
        applyState(d.state);
        if(Array.isArray(d.patches)) patches = d.patches;
        applyPatches(); renderAll(); loadMusic();
        _doSave();
        toast('登 录 成 功：本机未上传的修改已上传到云端');
      }else{
        toast('登 录 成 功，现在保存的内容会同步给所有人');
      }
      if(stateEl) stateEl.textContent = '当前状态：已登录 ' + ((u && u.email) || em) + '（现在保存会上传到云端）';
    }
  });
  /* 本机草稿管理：状态显示 + 上传 / 丢弃 / 恢复备份 */
  const refreshDraftState = () => {
    const el = document.getElementById('sb-draft-state');
    if(!el) return;
    const d = loadDraft(); const b = loadBackupDraft();
    const fmt = ts => ts ? new Date(ts).toLocaleString('zh-CN') : '未知时间';
    el.textContent = '本机未上传的修改：' + (d ? ('有（' + fmt(d.savedAt) + '）') : '无')
      + '　｜　本机备份：' + (b ? ('有（' + fmt(b.savedAt) + '）') : '无');
  };
  refreshDraftState();
  document.getElementById('sb-draft-push').addEventListener('click', async () => {
    const d = loadDraft();
    if(!d){ alert('本机没有未上传的修改。'); return; }
    if(!sbLoggedIn){ alert('请先登录，再上传本机修改。'); return; }
    if(!confirm('用本机这份修改（' + new Date(d.savedAt || Date.now()).toLocaleString('zh-CN') + '）覆盖云端当前内容？')) return;
    showProgress(null, '正在上传本机修改…');
    applyState(d.state);
    if(Array.isArray(d.patches)) patches = d.patches;
    applyPatches(); renderAll();
    const ok = await cloudSave({ baseStamp: lastCloudStamp });
    hideProgress();
    if(ok){ clearDraft(); toast('本 机 修 改 已 上 传 到 云 端 ✅'); }
    else toast('上传失败（网络问题），内容仍在本机，稍后再试');
    refreshDraftState();
    updateDraftBanner();
  });
  document.getElementById('sb-draft-drop').addEventListener('click', () => {
    if(!loadDraft()){ alert('本机没有未上传的修改。'); return; }
    if(!confirm('丢弃本机未上传的修改？\n\n丢弃后这份本机版本不再保留（云端内容不受影响）。')) return;
    clearDraft(); refreshDraftState();
    toast('本 机 草 稿 已 丢 弃');
  });
  document.getElementById('sb-draft-restore').addEventListener('click', () => {    const b = loadBackupDraft();
    if(!b){ alert('没有备份版本。'); return; }
    if(!confirm('把备份版本恢复为「本机未上传的修改」？')) return;
    try{ localStorage.setItem(LS_DRAFT, JSON.stringify(b)); }catch(e){}
    refreshDraftState();
    toast('已 恢 复 备 份 版 本');
  });
  document.getElementById('sb-logout').addEventListener('click', async () => {
    await logoutCloud();
    const stateEl = document.getElementById('sb-login-state');
    if(stateEl) stateEl.textContent = '当前状态：已登出（只能浏览，不能保存）';
    toast('已 登 出');
  });
  /* 音频上传自检：直接试传一个 4 字节的测试文件，把真实原因摆出来 */
  document.getElementById('sb-audio-test').addEventListener('click', async () => {
    const el = document.getElementById('sb-audio-test-result');
    const say = t => { if(el) el.textContent = t.split('\n')[0]; alert(t); };
    if(!sbConfigured()) return say('云同步还没配置：请先填写项目地址并点「保存配置」。');
    const u = await cloudUser();
    if(u){ sbLoggedIn = true; updateEditBar(); }
    if(!u) return say('这台设备还没登录。\n\n音频上传只允许登录用户，请先在上面填邮箱和密码，点「登 录」。');
    const f = new File([new Blob([new Uint8Array([1,2,3,4])], { type:'audio/mpeg' })], 'selftest.mp3', { type:'audio/mpeg' });
    say('正在上传测试文件…（请稍候）');
    const up = await uploadAudioToCloud(f, 'selftest');
    if(up.url){
      say('✅ 音频上传功能正常！\n\n测试文件已上传成功：\n' + up.url + '\n\n你可以到 Supabase → Storage → fupo-audio 把这个 selftest 文件删掉。');
    }else{

  });
  /* 把内嵌 base64 图片搬到云端存储：数据行变小后，国内网络读取就不容易被掐断 */
  document.getElementById('sb-offload-images').addEventListener('click', async () => {
    const el = document.getElementById('sb-audio-test-result');
    const say = t => { if(el) el.textContent = t.split('\n')[0]; };
    if(!sbConfigured()) return alert('还没配置云同步。');
    if(!sbLoggedIn) return alert('请先登录，再搬图片。');
    const before = Math.round(JSON.stringify(state).length / 1024);
    const imgs = countInlineImages();
    if(!imgs) return alert('当前内容里没有内嵌图片，不需要搬（数据行已经很小）。');
    if(!confirm('当前数据行约 ' + before + ' KB，其中内嵌图片 ' + imgs + ' 张。\n\n把图片搬到云端存储？\n· 同步会明显变快、更稳\n· 图片改为独立链接，所有人照样能看到\n\n（图片多时需要一两分钟，请勿关闭页面）')) return;
    say('正在搬运图片… 已完成 0/' + imgs);
    showProgress(0, '正在搬运图片… 0/' + imgs);
    let moved = 0, guard = 0, saveOk = true;
    try{
      while(guard++ < 40){
        const r = await migrateInlineImages(6);
        moved += r.moved;
        showProgress(Math.round(moved / imgs * 100), '正在搬运图片… ' + moved + '/' + imgs);
        say('正在搬运图片… 已完成 ' + moved + '/' + imgs);
        if(!r.moved) break;
        /* 瘦身后的保存：跳过预读、直接写（大响应预读会挂死） */
        saveOk = await cloudSave({ skipPrecheck: true, baseStamp: lastCloudStamp });
        if(saveOk) clearDraft();
        if(!saveOk) break;
        await new Promise(res => setTimeout(res, 1000));
      }
      if(saveOk){

    alert('完成！\n\n· 已搬到云端：' + moved + ' 张\n· 数据行：' + before + ' KB → ' + after + ' KB\n· 还剩内嵌图片：' + left + ' 张' + (left ? '\n\n（还剩一些，可以再点一次这个按钮继续搬）' : '') + '\n\n现在同步会稳定得多。');
  });
  /* 恢复云端上一版：每次覆盖前系统会自动留一份备份 */
  document.getElementById('sb-restore-prev').addEventListener('click', async () => {
    if(!sbConfigured()){ toast('请先配置云同步'); return; }

      if(error) throw error;
      if(!data || !data[SB_COL_DATA]){ alert('云端还没有备份版本。\n\n系统会在你「覆盖保存」之前自动备份上一版，所以先正常保存一次之后就会有。'); return; }
      const when = data.updated_at ? new Date(data.updated_at).toLocaleString('zh-CN') : '未知时间';
      if(!confirm('用云端备份版本替换当前内容？\n\n备份时间：' + when + '\n\n（当前内容会先被备份，可再次找回）')) return;
      lastCloudStamp = null; /* 强制走覆盖分支（内部仍会先备份当前版本） */
      applyState(data[SB_COL_DATA]);
      if(Array.isArray(data[SB_COL_PATCHES])) patches = data[SB_COL_PATCHES];
      applyPatches(); renderAll(); loadMusic();
      _doSave();
      toast('已 恢 复 云 端 备 份 版 本');
    }catch(e){
      alert('读取备份失败：' + ((e && e.message) || '未知错误'));
    }
  });
}

function renderGate(){

    setTimeout(() => { if(gate.parentNode) gate.remove(); }, 400);
    const tryPlayOnce = () => {
      musicIntent = true;
      if(musicReady && audioEl.paused) audioEl.play().catch(()=>{});
      document.removeEventListener('click', tryPlayOnce);
      document.removeEventListener('touchstart', tryPlayOnce);
    };
    document.addEventListener('click', tryPlayOnce, { once:true });
    document.addEventListener('touchstart', tryPlayOnce, { once:true });
    return;
  }
  gate.classList.remove('hide');
  gate.innerHTML = `
    <div class="gate-ink" aria-hidden="true"></div>
    <div class="gate-mount" aria-hidden="true"></div>
    <div class="gate-inner">
      <picture class="gate-logo-pic"><source type="image/webp" media="(min-width:821px)" srcset="https://api.minggg.top/storage/v1/object/public/fupo-audio/mat-logo-d.webp"><source type="image/webp" srcset="https://api.minggg.top/storage/v1/object/public/fupo-audio/mat-logo-m.webp"><img class="gate-logo" width="440" height="786" decoding="async" fetchpriority="high" src="https://api.minggg.top/storage/v1/object/public/fupo-audio/mat-logo-m.png" alt="${esc(g.title || state.meta.title || '浮魄')}"></picture>
      ${g.sub ? `<p class="gate-sub">${esc(g.sub)}</p>` : ''}
      <h1 class="gate-title">${esc(g.title || state.meta.title || '浮魄').split('').map((ch2, i) => `<span class="g-char" style="animation-delay:${(0.18 + i * 0.16).toFixed(2)}s">${esc(ch2)}</span>`).join('')}</h1>
      <div class="gate-rule"></div>
      ${g.tip ? `<p class="gate-tip">${esc(g.tip)}</p>` : ''}
      <p class="gate-tap">${esc(g.btn && g.btn !== '入 界' ? g.btn : '轻 触 入 界')}</p>
      
      <button class="gate-btn" id="gate-btn" style="display:none">${esc(g.btn || '入 界')}</button>
      ${g.note ? `<p class="gate-note">${esc(g.note)}</p>` : ''}
    </div>`;
  const gateBtn = gate.querySelector('#gate-btn');
  let entered = false;
  var gateTapX = 0, gateTapY = 0;
function enter(){
    if(entered) return;
    entered = true;
    gate.classList.add('hide');
    document.body.style.overflow = '';
    musicIntent = true;
    /* 走完整墨迹过场：墨先盖住 → 开卷页在墨下就位 → 墨散开时看到开卷页 */
    try{
      inkTransition(gateTapX, gateTapY,
        function(){ try{ openIndex(); }catch(e){} },
        null);
    }catch(e){ try{ openIndex(); }catch(e2){} }   /* 开卷 = 想听音乐：即使歌单还在加载，加载完会自动响起 */
    if(musicReady && audioEl.paused) audioEl.play().catch(()=>{});
    setTimeout(() => { if(gate.parentNode) gate.parentNode.removeChild(gate); try{ FUPO_BG.attach(); }catch(e){} }, 900);
    document.removeEventListener('keydown', gateKey);
  }
  /* 回车也可以入界 */
  const gateKey = e => { if(e.key === 'Enter') enter(); };
  document.addEventListener('keydown', gateKey);
  if(gateBtn) gateBtn.addEventListener('click', enter);
  /* 点门帘任意位置都能入界（红色按钮已去掉） */
  gate.addEventListener('click', e => { try{ gateTapX = e.clientX || window.innerWidth/2; gateTapY = e.clientY || window.innerHeight/2; }catch(e2){} enter(); });
  gate.addEventListener('touchend', e => { if(!entered){ try{ var t=e.changedTouches&&e.changedTouches[0]; if(t){ gateTapX=t.clientX; gateTapY=t.clientY; } }catch(e2){} e.preventDefault(); enter(); } }, { passive: false });
  document.body.style.overflow = 'hidden';
}

const realmScroll = { surface: 0, abyss: 0 };
let scrollSaveTimer = null;
let bgScrollTimer = null;
window.addEventListener('scroll', () => {

  try{ updatePillCover(); }catch(e){}
  if(scrollSaveTimer) return;
  scrollSaveTimer = setTimeout(() => {
    scrollSaveTimer = null;

    try{ updateTocActive(); }catch(e){}
    try{ saveReadPos(); }catch(e){}
  }, 180);
}, { passive: true });

function maxScrollY(){
  return Math.max(0, (document.documentElement.scrollHeight || 0) - window.innerHeight);
}
/* 渲染但保持阅读位置：你在改内容时，正在阅读的人不会被弹回顶部 */
let pendingRenderWhileHidden = false;
function renderAllKeepScroll(){
  /* 减压：标签页在后台时先不重画（省电省 CPU），回到前台再渲染 */
  if(document.hidden){ pendingRenderWhileHidden = true; return; }
  const y = (typeof window.scrollY === 'number') ? window.scrollY : 0;
  renderAll();
  const put = () => window.scrollTo(0, Math.min(y, maxScrollY()));
  requestAnimationFrame(() => requestAnimationFrame(put));
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && pendingRenderWhileHidden){
    pendingRenderWhileHidden = false;
    const y = (typeof window.scrollY === 'number') ? window.scrollY : 0;
    renderAll();
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, Math.min(y, maxScrollY()))));
  }
});
/* 切回某个界面时，回到上次读到的位置（第一次进入即顶部） */
function restoreRealmScroll(r){
  const y = Math.min(realmScroll[r] || 0, maxScrollY());
  const put = () => window.scrollTo(0, Math.min(y, maxScrollY()));
  requestAnimationFrame(() => requestAnimationFrame(put));
}

function setRealm(r, origin, keepPos){
  if(realm === r) return;
  const fromY = window.scrollY || 0;
  try{ realmScroll[realm] = fromY; }catch(e){}   /* 记住离开时的位置 */
  const veil = document.getElementById('realm-veil');
  if(veil && origin){
    veil.style.setProperty('--rx', origin.x + 'px');
    veil.style.setProperty('--ry', origin.y + 'px');
    veil.classList.remove('play');
    void veil.offsetWidth;
    veil.classList.add('play');
  }
  const wasPlaying = musicReady && !audioEl.paused;
  if(wasPlaying) musicIntent = true;   /* 切换界面时保持「想听音乐」的意图，回来自动续播 */
  realm = r;
  document.body.classList.toggle('abyss', r === 'abyss');
  renderAll();
  if(keepPos){
    /* 保持位置：不做平滑滚动，直接落到离开前的高度 */
    try{ window.scrollTo(0, fromY); }catch(e){}
    try{ realmScroll[r] = fromY; }catch(e){}
  }else{
    restoreRealmScroll(r);   /* 回到该界面上次读到的位置（首次进入 = 顶部） */
  }
  loadMusic();
  try{ musicPickShuffle(); }catch(e){}
  toast(r === 'abyss' ? '已 入 上 古 · 内容与音乐均为独立栏目' : '已 归 表 层');
}

/* ===== 速查：结果清理与去重 ===== */
function askClean(t){
  return String(t || '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')      /* 图片语法 */
    .replace(/\*\*/g, '')                          /* 粗体星号 */
    .replace(/^\s*[#>\-\*]+\s*/gm, '')            /* 行首标记 */
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function askDedupe(hits){
  var out = [], seen = [];
  hits.forEach(function(h){
    var key = askClean(h.text).replace(/\s+/g, '');
    var head = key.slice(0, 44);
    var dup = seen.some(function(k){
      return k.indexOf(head) >= 0 || head.indexOf(k.slice(0, 44)) >= 0 || (key && k.slice(0, 44) === head);
    });
    if(dup) return;
    seen.push(key);
    out.push(h);
  });
  return out;
}
function askTokens(q){
  var t = String(q || '').replace(/[？?。，,、！!；;：:\s"'（）()【】\[\]《》·「」]+/g, ' ').trim();
  var toks = [];
  t.split(' ').filter(Boolean).forEach(function(seg){
    if(/^[A-Za-z0-9]+$/.test(seg)){ if(seg.length >= 2) toks.push(seg.toLowerCase()); return; }
    for(var i = 0; i < seg.length - 1; i++) toks.push(seg.substr(i, 2));   /* 中文取二元组 */
    if(seg.length === 1) toks.push(seg);
  });
  return toks;
}
function askSearch(q){
  var toks = askTokens(q);
  if(!toks.length) return [];
  var corpus = askCorpus(), scored = [];
  corpus.forEach(function(c){
    var title = String(c.title || '').toLowerCase();
    var hay = (title + ' ' + String(c.text || '')).toLowerCase();
    var sc = 0, hit = 0;
    toks.forEach(function(w){
      if(hay.indexOf(w) >= 0){ sc += (title.indexOf(w) >= 0 ? 3 : 1); hit++; }
    });
    if(hit > 0) scored.push({ c: c, sc: sc + hit, hit: hit });
  });
  scored.sort(function(a, b){ return (b.sc - a.sc) || (b.hit - a.hit); });
  return scored.slice(0, 4).map(function(x){ return x.c; });
}

  var modals = document.querySelectorAll('#modal-root .modal, .modal.on, .modal:not([hidden])');
  for(var i = 0; i < modals.length; i++){ if(fupoVisible(modals[i])) return 'modal'; }
  var dw = document.querySelector('.drawer.on, #drawer.on, .panel-drawer.on');
  if(fupoVisible(dw)) return 'drawer';
  var lb = document.querySelector('.lightbox.on, #lightbox.on');
  if(fupoVisible(lb)) return 'lightbox';
  if(document.body.classList.contains('focusing')) return 'focus';
  return null;
}
function fupoCloseTop(){
  var which = fupoAnyOpen();
  if(!which) return null;
  try{
    if(which === 'ask'){ document.getElementById('ask-panel').classList.remove('on'); document.body.style.overflow = ''; return which; }
    if(which === 'guard'){ document.getElementById('exit-guard').classList.remove('on'); return which; }
    if(which === 'index'){
      document.getElementById('index').classList.remove('on');
      var fb = document.getElementById('focus-back'); if(fb) fb.classList.remove('show');
      document.body.style.overflow = ''; return which;
    }
    if(which === 'modal'){ try{ closeModal(); }catch(e){ var m = document.querySelector('#modal-root .modal'); if(m) m.remove(); var mk = document.querySelector('#modal-root .mask, #modal-root .modal-mask'); if(mk) mk.remove(); } document.body.style.overflow=''; return which; }
    if(which === 'drawer'){ closeDrawer(); return which; }
    if(which === 'focus'){ exitFocus(); return which; }
    if(which === 'lightbox'){ var lb = document.querySelector('.lightbox.on, #lightbox.on'); if(lb) lb.classList.remove('on'); document.body.style.overflow=''; return which; }
  }catch(e){}
  return null;
}
function fupoShowExitGuard(){

var fupoLastBack = 0, fupoLastClick = 0;
/* 记录任意点击时刻：锚点跳转会产生 history 噪音，需要忽略 */
document.addEventListener('click', function(){ fupoLastClick = Date.now(); }, true);
document.addEventListener('touchend', function(){ fupoLastClick = Date.now(); }, true);
window.addEventListener('popstate', function(){

/* ============================================================
   启动
   ============================================================ */
(async function boot(){
  /* 访客本机的阅读偏好（字号/行距）先应用，避免闪烁 */
  try{ applyReadPrefs(); }catch(e){}
  /* 立刻用「本机缓存的云端内容」渲染：网络被拦截时也不会退回默认内容 */
  const cache = loadCloudCache();
  const draft = loadDraft();
  if(cache && cache.state){
    state = normalize(cache.state);
    patches = Array.isArray(cache.patches) ? cache.patches : loadPatches();
    if(cache.stamp) lastCloudStamp = cache.stamp;
  }else if(draft && draft.state){
    state = normalize(draft.state);
    patches = Array.isArray(draft.patches) ? draft.patches : loadPatches();
  }else{
    state = loadState() || normalize(deep(DEFAULT_DATA));
    patches = loadPatches();
  }
  retireLegacyBgPatches();
  applyPatches();
  renderAll();
  loadMusic();
  renderGate();
  saveSnapshot();
  initSupabase();
  if(sbConfigured()) subscribeCloud();
  if(cache){ setCloudStatus('working', '已显示本机缓存，正在读取云端最新版…'); }
  const cloud = await cloudLoad();
  if(cloud.ok){
    const cloudHas = !!(cloud.state && cloud.state.meta && cloud.state.worlds);
    const cloudStamp = cloud.updatedAt || null;
    if(cloudHas){
      /* 云端是共享的权威版本：刷新后一定显示云端内容（= 所有访客看到的内容） */
      applyState(cloud.state);
      if(Array.isArray(cloud.patches)){ patches = cloud.patches; savePatches(); }
      lastCloudStamp = cloudStamp;
      retireLegacyBgPatches();
      applyPatches();
      renderAll();
      loadMusic();
      editorToast(draft ? '已 载 入 云 端 内 容（本机另有一份未上传的修改，可在云同步设置里上传）' : '已 加 载 云 端 内 容');
    }else{
      /* 云端还没有内容：把当前内容（优先本机草稿）作为第一版上传 */
      _doSave();
      toast('云 端 为 空，已 上 传 当 前 内 容');
    }
  }else if(sbConfigured()){
    /* 云端读不到：继续显示缓存内容，并给出可点击重试的提示 */
    setCloudStatus('fail', cache ? '云端暂时读不到（显示本机缓存）· 点此重试' : '云端读取失败 · 点此重试');
  }
  /* 轮询兜底：即使实时通道被网络拦截，其他设备的更新也会在几秒内自动出现 */
  if(sbConfigured()) startCloudPoll();
  /* 登录状态：优先读本机会话（不依赖网络），必要时自动登录 */
  if(sbConfigured()) restoreAuthSession();
  updateDraftBanner();
  window.__fupoBooted = true;   /* 标记启动完成：之后补丁改动才会同步云端 */
  /* 若本次启动停用了旧的「动态背景」补丁，顺便把结果同步到云端（避免每台设备都弹一次提示） */
  if(window.__bgPatchesRetired){
    window.__bgPatchesRetired = false;
    const trySync = (n) => {
      if(sbLoggedIn){ try{ cloudSave({ skipPrecheck: true, baseStamp: lastCloudStamp }); }catch(e){} }
      else if(n > 0) setTimeout(() => trySync(n - 1), 3000);   /* 等自动登录完成后再试 */
    };
    setTimeout(() => trySync(3), 1500);
  }
  dlog('浮魄 版本：' + (typeof FUPO_BUILD !== 'undefined' ? FUPO_BUILD : '未知') + ' ｜ 数据来源：' + (cache ? '本机缓存' : '默认模板'));
})();

/* 恢复/自动建立登录状态：会话存在即视为已登录（写权限由服务端 RLS 决定） */
async function restoreAuthSession(){
  try{
    const { data } = await sb.auth.getSession();
    sbLoggedIn = !!(data && data.session);
  }catch(e){ sbLoggedIn = false; }
  updateEditBar();
  if(!sbLoggedIn && localStorage.getItem('fupo-sb-remember') === '1'){
    const em = localStorage.getItem('fupo-sb-email') || '';
    /* ★ 修复：登录时密码经过编码保存，这里必须解码再登录（之前直接拿来用，自动登录永远失败） */
    const rawPw = localStorage.getItem('fupo-sb-pass') || '';
    let pw = '';
    try{ pw = decodeURIComponent(escape(atob(rawPw))); }catch(e){ pw = ''; }
    if(em && pw){
      const r = await loginCloud(em, pw);
      if(r && r.error) console.warn('自动登录失败：', r.error.message);
    }
  }
  updateEditBar();
  /* 已登录 + 本机有未上传的草稿 → 不自动覆盖云端，改由用户明确选择（页面底部提示条 / 云同步设置里有按钮） */
  updateDraftBanner();
}

/* ============================================================
   动态背景：模糊落叶（内置 · 可开关 · 已做手机适配）
   ============================================================ */
const FUPO_BG = (function(){
  const ID = 'fupo-bg-canvas';
  const LIGHT = [
    ['rgba(160,134,80,1)', 'rgba(176,152,96,1)'],
    ['rgba(61,90,82,1)',   'rgba(86,116,104,1)'],
    ['rgba(158,51,40,1)',  'rgba(184,86,68,1)'],
    ['rgba(120,112,84,1)', 'rgba(150,140,104,1)']
  ];
  const DARK = [
    ['rgba(201,163,92,1)', 'rgba(226,192,120,1)'],
    ['rgba(201,74,58,1)',  'rgba(226,110,92,1)'],
    ['rgba(123,169,154,1)','rgba(150,196,180,1)'],
    ['rgba(150,140,120,1)','rgba(178,168,148,1)']
  ];
  const DENSITY = { off:[0,0,0], light:[5,10,0.7], normal:[9,18,1], rich:[14,26,1.15] };
  const FPS = 30;

  let cv = null, ctx = null, sprites = [], parts = [];
  let W = 0, H = 0, DPR = 1, running = false, last = 0, spritesAbyss = null, paused = false;
  let cfgKey = '', resizeTimer = null;

  const rnd = (a, b) => a + Math.random() * (b - a);

  function makeSprite(size, c1, c2){
    const pad = size * 0.9, s3 = 3;
    const c = document.createElement('canvas');
    c.width = (size + pad * 2) * s3; c.height = (size + pad * 2) * s3;
    const g = c.getContext('2d');
    g.scale(s3, s3); g.translate(pad, pad);
    const s = size;
    const leaf = () => {
      g.beginPath();
      g.moveTo(s * 0.5, 0);
      g.bezierCurveTo(s * 0.97, s * 0.26, s * 0.92, s * 0.74, s * 0.5, s);
      g.bezierCurveTo(s * 0.08, s * 0.74, s * 0.03, s * 0.26, s * 0.5, 0);
      g.closePath();
    };
    const grd = g.createLinearGradient(0, 0, s, s);
    grd.addColorStop(0, c1); grd.addColorStop(1, c2);
    const N = 14, R = size * 0.10;
    for(let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2, rr = R * (0.35 + 0.65 * ((i % 3) / 2));
      g.save(); g.translate(Math.cos(a) * rr, Math.sin(a) * rr);
      leaf(); g.globalAlpha = 0.11; g.fillStyle = grd; g.fill(); g.restore();
    }
    leaf(); g.globalAlpha = 0.55; g.fillStyle = grd; g.fill();
    g.globalAlpha = 0.18; g.strokeStyle = 'rgba(255,255,255,.9)';
    g.lineWidth = Math.max(0.6, s * 0.025);
    g.beginPath(); g.moveTo(s * 0.5, s * 0.10); g.lineTo(s * 0.5, s * 0.90); g.stroke();
    return c;
  }
  function buildSprites(isAbyss){
    const pal = isAbyss ? DARK : LIGHT;
    const sizes = isAbyss ? [12, 17, 23] : [13, 18, 25];
    sprites = [];
    for(let i = 0; i < pal.length; i++){
      for(let j = 0; j < sizes.length; j++){
        sprites.push({ img: makeSprite(sizes[j], pal[i][0], pal[i][1]), size: sizes[j], alpha: isAbyss ? 0.16 : 0.22 });
      }
    }
  }
  function resizeCanvas(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.max(1, Math.floor(W * DPR));
    cv.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if(ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
  }
  function densityCfg(){
    const m = (state.meta && state.meta.bgEffect) || {};
    const d = DENSITY[m.density] || DENSITY.normal;
    return { count: W < 820 ? d[0] : d[1], mul: d[2] };
  }
  function buildParts(){
    const dc = densityCfg();
    const isMobile = W < 820;
    let count = dc.count;
    if(!isMobile) count = Math.min(26, Math.round(count * Math.min(1.4, W / 1400 + 0.6)));
    parts = [];
    for(let i = 0; i < count; i++){
      const depth = Math.random();
      parts.push({
        x: rnd(-40, W + 40), y: rnd(-H, H),
        vy: rnd(9, 20) * (0.55 + depth * 0.9),
        amp: rnd(8, 26) * (0.5 + depth),
        sp: rnd(0.25, 0.6),
        rot: rnd(0, Math.PI * 2), vr: rnd(-0.25, 0.25),
        scale: 0.55 + depth * 0.75,
        alpha: (0.5 + depth * 0.5) * (0.75 + Math.random() * 0.5) * dc.mul,
        si: Math.floor(Math.random() * 9),
        t: rnd(0, 100)
      });
    }
  }
  /* 门帘在时把画布放进门帘里（垫在文字下），避免门帘透出正文造成"重影" */
  function ensurePlacement(){
    if(!cv) return;
    const gate = document.getElementById('gate');
    const inGate = !!(gate && gate.parentNode && !gate.classList.contains('hide'));
    const want = inGate ? gate : document.body;
    /* 注意：门帘被移除后画布可能"挂"在已脱离文档的节点上，必须用 contains 判断 */
    if(cv.parentNode !== want || !document.body.contains(cv)){
      want.insertBefore(cv, want.firstChild);
      resizeCanvas();
    }
  }
  function paint(dt){
    ensurePlacement();
    if(!parts.length) return;
    const isAbyss = document.body.classList.contains('abyss');
    if(isAbyss !== spritesAbyss){ buildSprites(isAbyss); spritesAbyss = isAbyss; }
    ctx.clearRect(0, 0, W, H);
    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.t += dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      let x = p.x + Math.sin(p.t * p.sp) * p.amp + Math.sin(p.t * 0.17) * 12;
      if(p.y > H + 60){ p.y = -60; p.x = rnd(-40, W + 40); }
      if(x < -80) x = W + 60; else if(x > W + 80) x = -60;
      const sp = sprites[p.si % sprites.length];
      if(!sp) continue;
      const s = sp.size * p.scale * 2.1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, sp.alpha * p.alpha));
      ctx.translate(x, p.y); ctx.rotate(p.rot);
      ctx.drawImage(sp.img, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }
  function frame(now){
    if(!running) return;
    requestAnimationFrame(frame);
    if(paused) return;                          /* 浮层打开 / 正在滑动：停帧，不动画布本身 */
    if(document.hidden) return;                 /* 后台不画 */
    if(last && now - last < 1000 / FPS) return; /* 限帧 */
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
    last = now;
    paint(dt);
  }
  function start(){
    if(running) return;
    if(!cv){
      /* 清掉同 id 的残留画布（例如旧「动态背景」补丁留下的），避免两套动画打架 */
      document.querySelectorAll('#' + ID).forEach(el => el.remove());
      cv = document.createElement('canvas');
      cv.id = ID;
      document.body.insertBefore(cv, document.body.firstChild);
      ctx = cv.getContext('2d', { alpha: true });
    }
    DPR = Math.min(window.devicePixelRatio || 1, W < 820 ? 2 : 2);
    resizeCanvas();
    buildSprites(document.body.classList.contains('abyss'));
    spritesAbyss = document.body.classList.contains('abyss');
    buildParts();
    running = true; last = 0;
    /* 手机端：只画一帧静态叶子，不进入逐帧循环 —— 从根上消除闪屏与耗电
       （需要看动画可执行 window.__fupoAnimForce = true 后再刷新） */
    if(W < 820 && !window.__fupoAnimForce){
      try{ paint(0.016); }catch(e){}
      return;
    }
    requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(cv && cv.parentNode) cv.parentNode.removeChild(cv);
    cv = null; ctx = null; parts = []; sprites = [];
  }
  /* 根据设置与系统偏好，决定开/关/重建 */
  function apply(){
    const want = !!(state.meta && state.meta.bgEffect && state.meta.bgEffect.enabled);
    let reduced = false;
    try{ reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    const key = want + '|' + reduced + '|' + ((state.meta.bgEffect || {}).density || '') + '|' + (W < 820);
    if(key === cfgKey && (!want || (cv && cv.parentNode))) return;   /* 画布丢了也要重建 */
    cfgKey = key;
    if(!want || reduced){ stop(); return; }
    start();
  }
  /* 尺寸变化：只在宽度变化（横竖屏）时重建；键盘弹出这类高度变化只调整画布 */
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(!running) return;
      const ow = W;
      resizeCanvas();
      if(Math.abs(ow - W) > 100) buildParts();   /* 键盘导致的纯高度变化不再重建，避免闪屏 */
      cfgKey = '';
      apply();
    }, 300);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) last = 0; });

  /* 有浮层（搜索/弹窗/目录）时暂停动画：避免与 backdrop-filter 模糊层叠加导致手机端闪屏 */
  /* 画布守护：门帘移除、外部脚本清理等原因导致画布脱离文档时，自动接回并补画
     （手机端是"单帧静态"模式，没有下一帧去自动修复，必须靠这个守护） */
  setInterval(() => {
    try{
      if(!running || !cv) return;
      if(document.body.contains(cv)) return;
      cv.id = ID;
      document.body.insertBefore(cv, document.body.firstChild);
      resizeCanvas();
      if(W < 820 && !window.__fupoAnimForce) paint(0.016);
    }catch(e){}
  }, 1200);

  /* 暂停：只停帧，不动 opacity —— 之前瞬间隐藏画布会造成"打开弹窗闪一下" */
  function pauseAnim(){ paused = true; }
  function resumeAnim(){ paused = false; last = 0; }
  /* 立即把画布接回文档（入界后门帘被移除时调用） */
  function attachCanvas(){
    try{
      if(!running || !cv) return;
      if(document.body.contains(cv) && !(document.getElementById('gate') && document.getElementById('gate').contains(cv))){ return; }
      document.body.insertBefore(cv, document.body.firstChild);
      resizeCanvas();
      if(W < 820 && !window.__fupoAnimForce) paint(0.016);
    }catch(e){}
  }

  return {
    apply, stop, start, pause: pauseAnim, resume: resumeAnim, attach: attachCanvas,
    get running(){ return running; },
    get count(){ return parts.length; },
    setDensity(d){ if(state.meta && state.meta.bgEffect){ state.meta.bgEffect.density = d; } cfgKey = ''; apply(); }
  };
})();

/* 自定义背景图：按当前界面显示（表层一张、上古一张），并套一层蒙层保证正文可读 */
function applyCustomBg(){
  const cfg = (state.meta && state.meta.bgImage) || {};
  const url = (realm === 'abyss' ? cfg.abyss : cfg.surface) || '';
  let el = document.getElementById('fupo-bg-photo');
  if(!url){
    if(el) el.remove();
    return;
  }
  if(!el){
    el = document.createElement('div');
    el.id = 'fupo-bg-photo';
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.style.backgroundImage = 'url("' + String(url).replace(/["\\]/g, '') + '")';
  const dim = Math.max(0, Math.min(92, Number(cfg.dim)));
  el.style.setProperty('--bg-dim', ((isFinite(dim) ? dim : 72) / 100).toFixed(2));
  /* 保证在最底层：叶子画布与正文都在它之上 */
  if(document.body.firstChild !== el) document.body.insertBefore(el, document.body.firstChild);
}

/* ============================================================
   内容工具：表层 ↔ 上古 一键同步 / 一键清除
   ============================================================ */
function regenIds(arr, kind){
  const out = deep(arr || []);
  const map = {};
  out.forEach(it => { if(it && it.id){ const n = uid(); map[it.id] = n; it.id = n; } });
  if(kind === 'sections') out.forEach(s => (s.entries || []).forEach(e => { e.id = uid(); }));
  if(kind === 'characters') out.forEach(c => (c.relations || []).forEach(r => { if(r && map[r.target]) r.target = map[r.target]; }));
  return out;
}

/* ★ 旧的「动态背景」补丁已内置到「外观设置」：自动停用（样式/功能都算），避免两层叶子打架、
   也避免旧样式补丁把门帘改成半透明 */
function retireLegacyBgPatches(){
  let changed = false;
  (patches || []).forEach(p => {
    if(!p || !p.enabled || typeof p.code !== 'string') return;
    const isOldBg =
      p.code.indexOf('fupo-bg-canvas') >= 0 ||
      (p.type === 'style' && p.code.indexOf('.gate{background:rgba(236,236,230') >= 0);
    if(isOldBg){ p.enabled = false; changed = true; }
  });
  if(changed){
    savePatches();
    window.__bgPatchesRetired = true;   /* 启动末尾会尝试同步云端 */
    setTimeout(() => { try{ toast('旧的「动态背景」补丁已自动停用（该功能已内置到「外观设置」，门帘已恢复不透明）'); }catch(e){} }, 2400);
  }
  return changed;
}

const READ_POS_KEY = 'fupo-read-pos';
const READ_SCALE_KEY = 'fupo-read-scale';
const READ_LH_KEY = 'fupo-read-lh';

/* 大图水印：把文字做成可平铺的 SVG 图案 */
function wmLayerHTML(){
  const wm = (state.meta && state.meta.watermark) || {};
  if(!wm.on) return '';
  const text = String(wm.text || state.meta.author || state.meta.title || '浮魄').slice(0, 24);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="140"><text x="14" y="80" font-size="13" font-family="serif" fill="rgba(255,255,255,.85)" transform="rotate(-22 110 70)">${text.replace(/[<>&"]/g, '')}</text></svg>`;
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return `<span class="wm-layer" style="background-image:url('${url}')"></span>`;
}

/* 字号 / 行距（访客本机偏好） */
function applyReadPrefs(){
  let sc = Number(localStorage.getItem(READ_SCALE_KEY) || 1);
  let lh = Number(localStorage.getItem(READ_LH_KEY) || 0);
  if(!isFinite(sc) || sc < 0.9 || sc > 1.3) sc = 1;
  document.documentElement.style.fontSize = (16 * sc).toFixed(2) + 'px';
  if(lh >= 1.6 && lh <= 2.6) document.documentElement.style.setProperty('--read-lh', lh.toFixed(2));
  else document.documentElement.style.removeProperty('--read-lh');
}
function openReadSettings(){
  const sc = Number(localStorage.getItem(READ_SCALE_KEY) || 1);
  const lh = Number(localStorage.getItem(READ_LH_KEY) || 0) || 2.15;
  showModal({
    title: '阅 读 设 置', hideFooter: true,
    body: `<div class="form">
      <div class="field full"><label>字号</label><input type="range" id="rd-scale" min="0.9" max="1.3" step="0.02" value="${sc}" style="width:100%"></div>
      <div class="field full"><label>行距</label><input type="range" id="rd-lh" min="1.6" max="2.6" step="0.05" value="${lh}" style="width:100%"></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn small primary" id="rd-save">保 存</button>
      <button class="btn small ghost" id="rd-reset">恢 复 默 认</button>
    </div>`,
  });
  const live = () => {
    localStorage.setItem(READ_SCALE_KEY, document.getElementById('rd-scale').value);
    localStorage.setItem(READ_LH_KEY, document.getElementById('rd-lh').value);
    applyReadPrefs();
  };
  document.getElementById('rd-scale').addEventListener('input', live);
  document.getElementById('rd-lh').addEventListener('input', live);
  document.getElementById('rd-save').addEventListener('click', () => { live(); closeModal(true); toast('已 保 存'); });
  document.getElementById('rd-reset').addEventListener('click', () => {
    localStorage.removeItem(READ_SCALE_KEY); localStorage.removeItem(READ_LH_KEY);
    applyReadPrefs(); closeModal(true); toast('已 恢 复 默 认');
  });
}
