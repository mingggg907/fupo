  let pill = document.getElementById('resume-pill');
  let rec = null;
  try{ rec = JSON.parse(localStorage.getItem(READ_POS_KEY) || 'null'); }catch(e){}
  const ok = rec && rec.realm === realm && rec.y > 400 && (Date.now() - (rec.at || 0) < 7 * 864e5);
  if(!ok){ if(pill) pill.classList.remove('on'); return; }
  if(!pill){
    pill = document.createElement('button');
    pill.id = 'resume-pill';
    pill.type = 'button';
    pill.addEventListener('click', () => { window.scrollTo({ top: rec.y, behavior: 'smooth' }); pill.classList.remove('on'); });
    document.body.appendChild(pill);
  }
  pill.textContent = '继 续 阅 读';
  pill.classList.add('on');
  try{ updatePillCover(); }catch(e){}
}
/* 「继续阅读」气泡不要压住留言区（手机上会挡到留言与按钮） */
function updatePillCover(){
  const pill = document.getElementById('resume-pill');
  if(!pill || !pill.classList.contains('on')) return;
  const idx = document.getElementById('index');
  const covered = !!(idx && idx.classList.contains('on'));   /* 只在开卷页盖住时隐藏 */
  pill.style.opacity = covered ? '0' : '';
  pill.style.pointerEvents = covered ? 'none' : '';
}

function updateTocActive(){
  const toc = document.getElementById('toc');
  if(!toc || !toc._items) return;
  const mid = window.innerHeight * 0.34;
  let best = 0;
  toc._items.forEach((it, i) => {
    const r = it.el.getBoundingClientRect();
    if(r.top - mid <= 0) best = i;
  });
  toc.classList.toggle('on', (window.scrollY || 0) > 240);
  toc.querySelectorAll('[data-toc]').forEach((b, i) => b.classList.toggle('on', i === best));
}

/* 关系图导出为图片 */
/* 关系网全屏操作（手机端主入口）：单指拖动 / 双指缩放 / 点圆点看角色 / 双击放大 */
function openGraphFull(){
  const src = document.querySelector('#relation-graph svg');
  if(!src){ toast('还没有关系数据'); return; }
  showModal({
    title: '关 系 网', hideFooter: true, wide: true,
    body: `<div class="graph-stage" id="graph-stage"><div class="graph-zoom" id="graph-zoom">${src.outerHTML}</div></div>
      <p class="graph-hint">单指拖动 · 双指缩放 · 双击放大 · 点圆点查看角色</p>`
  });
  bindGraphStage();
}
function bindGraphStage(){
  const stage = document.getElementById('graph-stage');
  const zoom = document.getElementById('graph-zoom');
  if(!stage || !zoom) return;
  let scale = 1, tx = 0, ty = 0, sx = 0, sy = 0, moved = 0, dragging = false;
  const pts = new Map();
  const applyT = () => { zoom.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; };
  const dist = () => { const a = [...pts.values()]; return a.length < 2 ? 0 : Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); };
  let startDist = 0, startScale = 1;
  const mid = () => { const a = [...pts.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 }; };
  let startMid = { x: 0, y: 0 }, startTx = 0, startTy = 0;
  stage.addEventListener('pointerdown', e => {
    try{ stage.setPointerCapture(e.pointerId); }catch(e2){}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pts.size === 1){ dragging = true; moved = 0; sx = e.clientX - tx; sy = e.clientY - ty; }
    else if(pts.size === 2){ dragging = false; startDist = dist(); startScale = scale; startMid = mid(); startTx = tx; startTy = ty; }
  });
  stage.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pts.size >= 2){
      const d = dist();
      if(startDist > 0 && d > 0){
        const ns = Math.max(.5, Math.min(3.2, startScale * d / startDist));
        const m = mid();
        tx = startTx + (m.x - startMid.x); ty = startTy + (m.y - startMid.y);
        scale = ns; applyT();
      }
      return;
    }
    if(dragging){
      const nx = e.clientX - sx, ny = e.clientY - sy;
      moved += Math.abs(nx - tx) + Math.abs(ny - ty);
      tx = nx; ty = ny; applyT();
    }
  });
  const end = e => { pts.delete(e.pointerId); if(!pts.size) dragging = false; if(pts.size < 2){ startDist = 0; } };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('pointerleave', end);
  stage.addEventListener('click', e => {
    if(moved > 8){ moved = 0; return; }              /* 拖动过就不算点击 */
    const n = e.target.closest ? e.target.closest('.rel-node') : null;
    if(n && n.dataset.id){
      const id = n.dataset.id;
      closeModal(true);
      setTimeout(() => { try{ openCharacter(id); }catch(e2){} }, 180);
    }
  });
  stage.addEventListener('dblclick', () => { scale = scale > 1.5 ? 1 : 2; if(scale === 1){ tx = 0; ty = 0; } applyT(); });
}
async function exportRelationGraph(){  const svg = document.querySelector('#relation-graph svg');
  if(!svg){ toast('暂无可导出的关系图'); return; }
  try{
    showProgress(null, '正在生成关系图…');
    const clone = svg.cloneNode(true);
    /* 头像转成内嵌数据，避免导出时跨域失败 */
    const imgs = [...clone.querySelectorAll('image')];
    await Promise.all(imgs.map(async (im) => {
      const href = im.getAttribute('href') || '';
      if(!href || href.startsWith('data:')) return;
      try{
        const r = await fetch(href, { mode: 'cors' });
        const b = await r.blob();
        const dataUrl = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(''); fr.readAsDataURL(b); });
        if(dataUrl) im.setAttribute('href', dataUrl); else im.remove();
      }catch(e){ im.remove(); }
    }));
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.style.background = getComputedStyle(document.body).backgroundColor || '#ecece6';
    const xml = new XMLSerializer().serializeToString(clone);
    const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
    const scale = 2;
    const cv = document.createElement('canvas');
    cv.width = 680 * scale; cv.height = 460 * scale;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#ecece6';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    hideProgress();
    cv.toBlob(blob => {
      if(!blob){ toast('导出失败，请重试'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '浮魄-关系图.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('关系图已导出');
    }, 'image/png');
  }catch(e){
    hideProgress();
    /* 退路：导出 SVG 文件 */
    try{
      const svg2 = document.querySelector('#relation-graph svg');
      const xml = new XMLSerializer().serializeToString(svg2);
      const a = document.createElement('a');
      a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
      a.download = '浮魄-关系图.svg';
      document.body.appendChild(a); a.click(); a.remove();
      toast('已导出 SVG 关系图');
    }catch(e2){ toast('导出失败'); }
  }
}

/* 图片点击放大查看详情（正文里的 .rich-img / .inline-img） */
/* 页面整体禁止缩放（iOS 会忽略 user-scalable=no，这里再兜底）；灯箱内允许缩放图片 */
(function lockPageZoom(){
  const inLightbox = el => !!(el && el.closest && el.closest('.fupo-lightbox'));
  ['gesturestart','gesturechange','gestureend'].forEach(ev => {
    document.addEventListener(ev, e => { if(!inLightbox(e.target)) e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', e => {
    if(e.touches && e.touches.length > 1 && !inLightbox(e.target)) e.preventDefault();
  }, { passive: false });
  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    const interactive = e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, label, [data-act], [data-action]');
    if(now - lastTap < 300 && !interactive && !inLightbox(e.target)) e.preventDefault();
    lastTap = now;
  }, { passive: false });
})();

function openLightbox(img){
  if(!img) return;
  document.querySelectorAll('.fupo-lightbox').forEach(el => el.remove());
  const lb = document.createElement('div');
  lb.className = 'fupo-lightbox';
  const im = document.createElement('img');
  im.src = img.currentSrc || img.src;
  const cap = document.createElement('div');
  cap.className = 'lb-cap';
  cap.textContent = img.alt || '';
  const close = document.createElement('button');
  close.className = 'lb-close';
  close.textContent = '✕';
  close.setAttribute('aria-label', '关闭');
  const tip = document.createElement('div');
  tip.className = 'lb-tip';
  tip.textContent = '双击放大 · 点空白关闭';
  lb.appendChild(im);
  if((state.meta && state.meta.watermark && state.meta.watermark.on)) lb.insertAdjacentHTML('beforeend', wmLayerHTML());
  if(cap.textContent) lb.appendChild(cap);
  lb.appendChild(tip);
  lb.appendChild(close);
  document.body.appendChild(lb);
  try{ syncBgAnim(); }catch(e){}

  /* —— 灯箱内缩放：图片可放大，页面不会被放大 —— */
  let scale = 1, tx = 0, ty = 0, startDist = 0, startScale = 1;
  let startX = 0, startY = 0, startTx = 0, startTy = 0, panning = false, lastTapAt = 0, suppressClick = 0;
  const apply = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    im.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
  };
  const reset = () => { scale = 1; tx = 0; ty = 0; apply(); };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const clampScale = s => Math.max(1, Math.min(5, s));
  apply();

  lb.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      startDist = dist(e.touches); startScale = scale; panning = false; e.preventDefault();
    }else if(e.touches.length === 1){
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = tx; startTy = ty; panning = scale > 1;
    }
  }, { passive: false });
  lb.addEventListener('touchmove', e => {
    if(e.touches.length === 2){
      e.preventDefault();
      const d = dist(e.touches);
      scale = clampScale(startScale * (d / (startDist || d)));
      if(scale <= 1.02){ tx = 0; ty = 0; }
      suppressClick = Date.now() + 400;
      apply();
    }else if(e.touches.length === 1 && panning){
      e.preventDefault();
      tx = startTx + (e.touches[0].clientX - startX);
      ty = startTy + (e.touches[0].clientY - startY);
      suppressClick = Date.now() + 400;
      apply();
    }
  }, { passive: false });
  lb.addEventListener('touchend', e => {
    if(e.touches.length === 0){
      const now = Date.now();
      if(now - lastTapAt < 300){          /* 双击：放大 / 还原 */
        if(scale > 1.2){ reset(); } else { scale = 2.5; tx = 0; ty = 0; apply(); }
        suppressClick = Date.now() + 400;
      }
      lastTapAt = now;
      panning = false;
      if(scale <= 1.02) reset();
    }
  });
  lb.addEventListener('wheel', e => {   /* 电脑：滚轮缩放 */
    e.preventDefault();
    scale = clampScale(scale * (e.deltaY < 0 ? 1.12 : 0.89));
    if(scale <= 1.02) { tx = 0; ty = 0; }
    apply();
  }, { passive: false });
  lb.addEventListener('dblclick', e => {   /* 电脑：双击缩放 */
    e.preventDefault();
    if(scale > 1.2){ reset(); } else { scale = 2.5; tx = 0; ty = 0; apply(); }
  });

  const esc = e => { if(e.key === 'Escape'){ remove(); } };
  const remove = () => { lb.remove(); document.removeEventListener('keydown', esc); try{ syncBgAnim(); }catch(e){} };
  lb.addEventListener('click', e => {
    if(Date.now() < suppressClick) return;          /* 刚拖动/缩放过，不误关 */
    if(e.target === lb || e.target === close) remove();
  });
  document.addEventListener('keydown', esc);
}
document.addEventListener('click', e => {
  const img = e.target.closest ? e.target.closest('img') : null;
  if(!img) return;
  if(!(img.classList.contains('inline-img') || img.closest('.rich-img'))) return;
  openLightbox(img);
});

/* 顶部传输进度条：pct 为 null 时显示"进行中"动画；否则按百分比推进 */
let transferBar = null;
function showProgress(pct, text){
  try{
    if(!transferBar){
      transferBar = document.createElement('div');
      transferBar.className = 'fupo-progress';
      transferBar.innerHTML = '<div class="bar"></div><div class="p-text"></div>';
      document.body.appendChild(transferBar);
    }
    transferBar.classList.toggle('indeterminate', pct == null);
    const bar = transferBar.querySelector('.bar');
    if(pct != null) bar.style.width = Math.max(2, Math.min(100, pct)) + '%';
    const txt = transferBar.querySelector('.p-text');
    if(text != null){ txt.textContent = text; txt.style.display = ''; }
    else txt.style.display = 'none';
  }catch(e){}
}
function hideProgress(){
  try{ if(transferBar){ transferBar.remove(); transferBar = null; } }catch(e){}
}
