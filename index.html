<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ecece6">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="format-detection" content="telephone=no">
<title>娴瓌</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#ecece6;--paper-2:#e4e4de;--paper-3:#d8d9d2;--ink:#1f2420;--ink-2:#4f574f;--ink-3:#828a80;--cinnabar:#9e3328;--cinnabar-2:#b8453a;--gold:#a08650;--jade:#3d5a52;--line:rgba(31,36,32,.14);--line-2:rgba(31,36,32,.06);--serif:"Songti SC","STSong","SimSun","Noto Serif SC","Source Han Serif SC","Songti TC",Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;--ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);color-scheme:light}
body.abyss{--paper:#0a0b0d;--paper-2:#111318;--paper-3:#181b21;--ink:#d8d8d0;--ink-2:#9a9a92;--ink-3:#6b6b65;--cinnabar:#c94a3a;--cinnabar-2:#e05a48;--gold:#c9a35c;--jade:#7ba99a;--line:rgba(216,216,208,.16);--line-2:rgba(216,216,208,.07);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%;background:#ecece6;background:var(--paper,#ecece6);color-scheme:light;forced-color-adjust:none}
body{margin:0;background:#ecece6;background:var(--paper,#ecece6);color:var(--ink,#1f2420);font-family:var(--sans);font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .7s var(--ease),color .7s var(--ease)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .7s;background:radial-gradient(56% 42% at 12% 6%,rgba(160,134,80,.07),transparent 62%),radial-gradient(52% 40% at 88% 18%,rgba(61,90,82,.06),transparent 62%),radial-gradient(70% 50% at 50% 100%,rgba(158,51,40,.04),transparent 65%)}
body.abyss::before{background:radial-gradient(56% 42% at 12% 6%,rgba(201,74,58,.09),transparent 62%),radial-gradient(52% 40% at 88% 18%,rgba(80,60,120,.1),transparent 62%),radial-gradient(70% 50% at 50% 100%,rgba(201,163,92,.05),transparent 65%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;mix-blend-mode:multiply;transition:opacity .7s,mix-blend-mode .7s;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
body.abyss::after{opacity:.07;mix-blend-mode:screen}
#app,.topbar,.site-footer{position:relative;z-index:2}
img{max-width:100%;display:block}
::selection{background:rgba(158,51,40,.18)}
body.abyss ::selection{background:rgba(201,74,58,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--paper-2)}
::-webkit-scrollbar-thumb{background:rgba(31,36,32,.2);transition:background .4s}
body.abyss ::-webkit-scrollbar-thumb{background:rgba(216,216,208,.2)}
::-webkit-scrollbar-thumb:hover{background:var(--cinnabar)}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:13px clamp(18px,4vw,48px);background:rgba(236,236,230,.82);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line);transition:box-shadow .3s,background .7s,border-color .7s}
body.abyss .topbar{background:rgba(10,11,13,.85)}
.topbar.scrolled{box-shadow:0 10px 30px -22px rgba(31,36,32,.5)}
body.abyss .topbar.scrolled{box-shadow:0 10px 30px -22px rgba(0,0,0,.9)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:1rem;letter-spacing:.3em;color:var(--ink);text-decoration:none;white-space:nowrap;transition:color .7s}
.brand-seal{width:24px;height:24px;flex:none;border-radius:2px;background:var(--cinnabar);color:#f7f2e8;display:grid;place-items:center;font-size:.68rem;line-height:1;box-shadow:inset 0 0 0 1.5px rgba(247,242,232,.45);transform:rotate(-4deg);overflow:hidden;transition:background .7s}
.brand-seal img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;gap:clamp(16px,2.4vw,28px);margin-left:auto}
.nav a{position:relative;color:var(--ink-2);text-decoration:none;font-family:var(--serif);font-size:.88rem;letter-spacing:.2em;padding:5px 1px;transition:color .28s}
.nav a::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:var(--cinnabar);transition:width .38s var(--ease),left .38s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a:hover::after{width:100%;left:0}
.topbar-actions{display:flex;gap:8px}
.icon-btn{margin-left:auto}
.nav+.icon-btn{margin-left:0}
.btn{font-family:var(--serif);font-size:.84rem;letter-spacing:.16em;background:transparent;color:var(--ink-2);border:1px solid var(--line);border-radius:2px;padding:7px 15px;cursor:pointer;white-space:nowrap;transition:.28s var(--ease);-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(158,51,40,.04)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cinnabar);color:#f7f2e8;border-color:var(--cinnabar)}
.btn.primary:hover{background:var(--cinnabar-2);border-color:var(--cinnabar-2);color:#fff}
.btn.small{font-size:.78rem;padding:5px 12px;letter-spacing:.12em}
.btn.ghost{opacity:.7}
.btn.ghost:hover{opacity:1}
.abyss-exit{display:none;font-family:var(--serif);font-size:.84rem;letter-spacing:.2em;color:#f7f2e8;background:var(--cinnabar);border:1px solid var(--cinnabar);border-radius:2px;padding:7px 16px;cursor:pointer;white-space:nowrap;transition:.3s;box-shadow:0 0 0 0 rgba(201,74,58,.6);animation:exitPulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
body.abyss .abyss-exit{display:inline-block}
.abyss-exit:hover{background:var(--cinnabar-2);transform:translateY(-1px)}
@keyframes exitPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,74,58,.5)}50%{box-shadow:0 0 0 10px rgba(201,74,58,0)}}
.icon-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--ink);font-size:1.05rem;line-height:1;cursor:pointer;transition:.25s;-webkit-tap-highlight-color:transparent}
.icon-btn:hover{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(158,51,40,.04)}
.menu-btn{display:grid;width:36px;height:36px;background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--ink);font-size:1rem;cursor:pointer;place-items:center}
.gate{position:fixed;inset:0;z-index:500;background:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .8s var(--ease-out),visibility .8s,background .7s}
.gate::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(50% 40% at 50% 40%,rgba(160,134,80,.1),transparent 65%),radial-gradient(60% 50% at 50% 100%,rgba(158,51,40,.06),transparent 65%)}
.gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate-inner{position:relative;z-index:1;max-width:520px}
.gate-sub{font-family:var(--serif);font-size:.74rem;letter-spacing:.6em;color:var(--gold);margin:0 0 20px;text-indent:.6em;animation:fadeUp 1.1s var(--ease-out) .1s both}
.gate-title{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,14vw,5.6rem);letter-spacing:.3em;text-indent:.3em;margin:0;background:linear-gradient(175deg,#141814 0%,#3d4a3e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:inkIn 1.8s var(--ease-out) both}
.gate-rule{width:0;height:1px;margin:30px auto;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);animation:ruleIn 1.4s var(--ease-out) .6s both}
.gate-tip{font-family:var(--serif);font-size:.84rem;letter-spacing:.5em;color:var(--ink-3);margin:0 0 46px;text-indent:.5em;animation:fadeUp 1s var(--ease-out) .9s both}
.gate-btn{font-family:var(--serif);font-size:.95rem;letter-spacing:.6em;color:#f7f2e8;background:var(--cinnabar);border:none;padding:14px 44px 14px 50px;border-radius:2px;cursor:pointer;transition:.35s var(--ease);box-shadow:0 14px 34px -14px rgba(158,51,40,.8);animation:fadeUp 1s var(--ease-out) 1.1s both;-webkit-tap-highlight-color:transparent}
.gate-btn:hover{background:var(--cinnabar-2);transform:translateY(-2px);box-shadow:0 20px 40px -14px rgba(158,51,40,.9)}
.gate-btn:active{transform:scale(.97)}
.gate-note{font-family:var(--serif);font-size:.74rem;letter-spacing:.24em;color:var(--ink-3);opacity:.7;margin:22px 0 0;text-indent:.24em;animation:fadeUp 1s var(--ease-out) 1.3s both}
.drawer{position:fixed;inset:0;z-index:90;background:rgba(31,36,32,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
body.abyss .drawer{background:rgba(0,0,0,.6)}
.drawer.open{opacity:1;pointer-events:auto}
.drawer-inner{position:absolute;top:0;right:0;bottom:0;width:min(300px,84vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(31,36,32,.6);padding:32px 28px;display:flex;flex-direction:column;gap:4px;transform:translateX(102%);transition:transform .42s var(--ease-out),background .7s;overflow-y:auto}
.drawer.open .drawer-inner{transform:none}
.drawer-title{font-family:var(--serif);font-size:.74rem;letter-spacing:.5em;color:var(--ink-3);margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line);text-indent:.5em}
.drawer a{display:block;padding:13px 2px;font-family:var(--serif);font-size:1rem;letter-spacing:.28em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2);transition:.25s}
.drawer a:active{color:var(--cinnabar);padding-left:8px}
.drawer-sep{height:22px}
.drawer .btn{text-align:center;width:100%;padding:10px;letter-spacing:.24em}
.search-panel{position:fixed;inset:0;z-index:150;background:rgba(24,28,24,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:clamp(20px,8vh,80px) 16px 16px;opacity:0;pointer-events:none;transition:opacity .28s}
body.abyss .search-panel{background:rgba(0,0,0,.75)}
.search-panel.open{opacity:1;pointer-events:auto}
.search-box{width:min(680px,100%);max-height:80vh;display:flex;flex-direction:column;background:var(--paper);border:1px solid rgba(160,134,80,.4);border-radius:3px;box-shadow:0 40px 90px -40px rgba(0,0,0,.75);transform:translateY(-12px) scale(.985);transition:transform .32s var(--ease-out),background .7s;overflow:hidden}
.search-panel.open .search-box{transform:none}
.search-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.6),transparent);transition:background .7s}
body.abyss .search-head{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.search-head .s-icon{font-size:1.15rem;color:var(--cinnabar);line-height:1;flex:none}
.search-head input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-family:var(--serif);font-size:1rem;letter-spacing:.08em;color:var(--ink)}
.search-head input::placeholder{color:var(--ink-3)}
.search-scope{padding:8px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;font-family:var(--serif);font-size:.78rem;letter-spacing:.14em;color:var(--ink-3);align-items:center;transition:border-color .7s}
.search-scope label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2)}
.search-scope input[type=checkbox]{accent-color:var(--cinnabar);width:14px;height:14px}
.search-hint{padding:22px 20px}
.hint-title{font-family:var(--serif);font-size:.76rem;letter-spacing:.24em;color:var(--ink-3);margin:0 0 14px;text-indent:.24em}
.hint-chips{display:flex;flex-wrap:wrap;gap:8px}
.hint-chips button{font-family:var(--serif);font-size:.82rem;letter-spacing:.1em;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.5);color:var(--ink-2);cursor:pointer;transition:.24s}
body.abyss .hint-chips button{background:rgba(255,255,255,.04)}
.hint-chips button:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.search-results{flex:1;overflow-y:auto;padding:0 8px 10px;overscroll-behavior:contain}
.result-item{display:block;width:100%;text-align:left;padding:14px 16px;border:none;background:transparent;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.2s;font-family:inherit;color:inherit}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:rgba(158,51,40,.045)}
.result-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.result-type{font-family:var(--serif);font-size:.68rem;letter-spacing:.22em;padding:2px 9px;border-radius:2px;flex:none;background:rgba(160,134,80,.1);border:1px solid rgba(160,134,80,.28);color:var(--gold)}
.result-title{font-family:var(--serif);font-size:1rem;letter-spacing:.12em;color:var(--ink)}
.result-snippet{font-size:.85rem;line-height:1.8;color:var(--ink-3)}
.result-snippet mark{background:rgba(158,51,40,.15);color:var(--cinnabar);font-weight:600;padding:0 2px;border-radius:2px}
.search-empty{padding:44px 20px;text-align:center;font-family:var(--serif);font-size:.88rem;letter-spacing:.2em;color:var(--ink-3);line-height:2.2}
@keyframes flashPulse{0%{box-shadow:0 0 0 0 rgba(158,51,40,.5)}50%{box-shadow:0 0 0 14px rgba(158,51,40,0)}100%{box-shadow:0 0 0 0 rgba(158,51,40,0)}}
.flash{animation:flashPulse 1.5s ease-out 2 !important;border-color:var(--cinnabar)!important}
.hero{position:relative;overflow:hidden;min-height:68vh;display:flex;align-items:center;justify-content:center;padding:clamp(80px,14vh,140px) clamp(20px,5vw,40px) clamp(60px,10vh,100px);text-align:center}
.hero-bg{position:absolute;inset:-7% -3%;z-index:0;-webkit-mask-image:radial-gradient(ellipse 68% 68% at 50% 46%,#000 18%,transparent 76%);mask-image:radial-gradient(ellipse 68% 68% at 50% 46%,#000 18%,transparent 76%)}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.3;filter:sepia(.28) contrast(.96) brightness(1.05)}
body.abyss .hero-bg img{opacity:.22;filter:sepia(.4) contrast(1.1) brightness(.75) hue-rotate(-15deg)}
.hero-inner{position:relative;z-index:1;max-width:720px;width:100%}
.hero-eyebrow{font-family:var(--serif);font-size:.74rem;letter-spacing:.6em;color:var(--gold);margin:0 0 22px;text-indent:.6em;opacity:0;animation:fadeUp 1s var(--ease-out) .15s both}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,10vw,5.2rem);line-height:1.2;letter-spacing:.22em;text-indent:.22em;margin:0;background:linear-gradient(175deg,#141814 0%,#3d4a3e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:inkIn 1.6s var(--ease-out) both}
body.abyss .hero-title{background:linear-gradient(175deg,#f5f5ee 0%,#c94a3a 100%);-webkit-background-clip:text;background-clip:text}
@keyframes inkIn{0%{opacity:0;letter-spacing:.7em;filter:blur(14px);transform:scale(.98)}100%{opacity:1;letter-spacing:.22em;filter:blur(0);transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero-rule{width:0;height:1px;margin:32px auto;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);animation:ruleIn 1.4s var(--ease-out) .5s both}
@keyframes ruleIn{to{width:min(220px,52%)}}
.hero-intro{text-align:left;color:var(--ink-2);font-family:var(--serif);font-size:clamp(.94rem,2.6vw,1.04rem);line-height:2.15;max-width:620px;margin:0 auto;opacity:0;animation:fadeUp 1.1s var(--ease-out) .75s both}
.hero-intro p{margin:0 0 1em}
.hero-intro p:last-child{margin-bottom:0}
.hero-author{margin:30px 0 0;font-family:var(--serif);font-size:.82rem;letter-spacing:.5em;color:var(--ink-3);text-indent:.5em;opacity:0;animation:fadeUp 1s var(--ease-out) 1s both}
.hero-edit{margin-top:28px;opacity:0;animation:fadeUp 1s var(--ease-out) 1.15s both}
.hero-vertical{position:absolute;right:clamp(20px,5vw,80px);top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--serif);font-size:clamp(.66rem,1.4vw,.8rem);letter-spacing:.7em;color:var(--ink-3);opacity:.4;pointer-events:none;transition:color .7s}
.abyss-mark{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:59;pointer-events:none;font-family:var(--serif);font-size:.72rem;letter-spacing:.6em;color:var(--cinnabar);text-indent:.6em;opacity:0;transition:opacity .6s var(--ease-out) .3s;padding:6px 20px;background:linear-gradient(90deg,transparent,rgba(201,74,58,.08),transparent)}
body.abyss .abyss-mark{opacity:1}
.sec{max-width:1080px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(18px,4vw,44px)}
.sec-head{display:flex;align-items:baseline;gap:20px;margin-bottom:clamp(28px,4vw,40px);padding-bottom:16px;border-bottom:1px solid var(--line);transition:border-color .7s}
.sec-head h2{position:relative;margin:0;padding-left:26px;font-family:var(--serif);font-weight:400;font-size:clamp(1.2rem,3vw,1.45rem);letter-spacing:.5em;color:var(--ink);text-indent:.5em;white-space:nowrap;transition:color .7s}
.sec-head h2::before{content:"";position:absolute;left:0;top:50%;width:7px;height:7px;background:var(--cinnabar);border-radius:1px;transform:translateY(-50%) rotate(45deg);transition:background .7s}
.sec-head .btn{margin-left:auto}
.sec-tools{display:flex;gap:4px;flex:none;margin-left:auto}
.sec-head .sec-tools+.btn{margin-left:10px}
.world-list{border-top:1px solid var(--line-2)}
.world-item{border-bottom:1px solid var(--line-2);position:relative;transition:border-color .7s}
.world-head{display:flex;flex-wrap:wrap;align-items:center;gap:22px;padding:24px 6px;cursor:pointer;transition:padding .35s var(--ease),color .3s;position:relative}
.world-head:hover{padding-left:22px;color:var(--cinnabar)}
.world-icon{font-size:1.15rem;flex:none;opacity:.65;transition:opacity .3s}
.world-head:hover .world-icon{opacity:1}
.world-title{flex:1;font-family:var(--serif);font-weight:400;font-size:clamp(1.02rem,2.5vw,1.16rem);letter-spacing:.32em;color:inherit;transition:color .7s}
.world-count{font-family:var(--serif);font-size:.74rem;letter-spacing:.24em;color:var(--ink-3);flex:none;padding-right:6px;transition:color .7s}
.world-arrow{flex:none;font-size:.8rem;color:var(--ink-3);transition:transform .4s var(--ease),color .3s}
.world-item.open .world-arrow{transform:rotate(90deg);color:var(--cinnabar)}
.world-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease-out)}
.world-item.open .world-body{grid-template-rows:1fr}
.world-body-inner{overflow:hidden}
.world-inner{padding:6px 6px 30px 40px}
.world-inner .entry{padding:22px 0;border-top:1px dashed var(--line-2);position:relative;transition:border-color .7s}
.world-inner .entry:first-child{border-top:none;padding-top:6px}
.entry-title{font-family:var(--serif);font-weight:400;font-size:1.02rem;letter-spacing:.2em;color:var(--cinnabar);margin:0 0 10px;padding-left:16px;position:relative;transition:color .7s}
.entry-title::before{content:"";position:absolute;left:0;top:50%;width:8px;height:1px;background:var(--cinnabar);transform:translateY(-50%);transition:background .7s}
.entry-content{color:var(--ink-2);font-size:.94rem;line-height:2.1;font-family:var(--serif);transition:color .7s}
.entry-content p{margin:0 0 .85em}
.entry-content p:last-child{margin-bottom:0}
.entry-content strong{color:var(--cinnabar);font-weight:600;transition:color .7s}
/* 鈽?淇1锛氬瘜鏂囨湰鍥剧墖鍏ュ満鍔ㄧ敾 */
.rich-img{margin:28px 0;overflow:hidden;border-radius:3px;background:var(--paper-2);transition:background .7s}
.rich-img img{width:100%;height:auto;opacity:0;filter:blur(14px) sepia(.14);transform:scale(1.05);transition:opacity 1.2s var(--ease-out),filter 1.2s var(--ease-out),transform 1.5s var(--ease-out)}
.rich-img.in img{opacity:1;filter:blur(0) sepia(.14);transform:none}
/* 鈽?淇2锛氬唴鑱斿浘鍩虹鏍峰紡 */
.inline-img{margin:12px 0;border-radius:2px;filter:sepia(.14);transition:filter .7s}
body.abyss .rich-img img{filter:blur(14px) sepia(.3) contrast(1.08) brightness(.82)}

async function uploadBlobToCloud(blob, ext, title, kind){
  if(!sbConfigured()) return { error: '鏈厤缃簯绔? };
  if(!sbLoggedIn) return { error: '杩欏彴璁惧杩樻病鐧诲綍浜戝悓姝? };

    const task = sb.storage.from(sbBucket()).upload(path, blob, {
      contentType: blob.type || (kind === 'image' ? 'image/jpeg' : 'audio/mpeg'), upsert: false, cacheControl: '31536000'
    });

    const res = await Promise.race([task, timeout]);
    if(!res || res.error) throw (res && res.error) || new Error('涓婁紶澶辫触');
    const { data } = sb.storage.from(sbBucket()).getPublicUrl(path);
    if(!data || !data.publicUrl) throw new Error('鏃犳硶鐢熸垚鍏紑閾炬帴');

const DATA_IMG_RE = /data:image\/[a-z0-9+.-]+;base64,[A-Za-z0-9+/=]+/gi;
function countInlineImages(){
  try{ return (JSON.stringify(state).match(DATA_IMG_RE) || []).length; }catch(e){ return 0; }
}
/* 鎶婁竴涓?data URL 涓婁紶鍒颁簯绔瓨鍌紝杩斿洖鍏紑閾炬帴 */
async function uploadDataUrl(dataUrl, title){
  const m = String(dataUrl).match(/^data:image\/([a-z0-9+.-]+);base64,(.*)$/i);
  if(!m) return null;
  const ext = (m[1] === 'jpeg' ? 'jpg' : m[1]).replace('+xml', '');
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'image/' + m[1] });
  const up = await uploadBlobToCloud(blob, ext, title || 'img', 'image');
  return up.url || null;
}
/* 鎶婃鏂?灏侀潰閲屽唴宓岀殑 base64 鍥剧墖鎼埌浜戠瀛樺偍锛岃鏁版嵁琛屽彉灏忥紙閬垮厤澶у搷搴旇缃戠粶鎺愭柇/鎸傛锛?*/
async function migrateInlineImages(limit){
  if(!sbConfigured() || !sbLoggedIn) return { moved:0, total:0, skipped:'闇€瑕佸厛鐧诲綍' };
  const cap = limit || 12;
  const total = countInlineImages();
  if(!total) return { moved:0, total:0 };
  let moved = 0;
  const processString = async (s) => {
    if(typeof s !== 'string' || s.indexOf('data:image') < 0 || moved >= cap) return s;
    const matches = s.match(DATA_IMG_RE) || [];
    let out = s;
    for(const du of matches){
      if(moved >= cap) break;
      const url = await uploadDataUrl(du, 'img');
      if(url){ out = out.split(du).join(url); moved++; }
    }
    return out;
  };
  const walk = async (node) => {
    if(node == null || moved >= cap) return node;
    if(typeof node === 'string') return await processString(node);
    if(Array.isArray(node)){
      for(let i = 0; i < node.length; i++){ if(moved >= cap) break; node[i] = await walk(node[i]); }
      return node;
    }
    if(typeof node === 'object'){
      for(const k of Object.keys(node)){
        if(moved >= cap) break;
        node[k] = await walk(node[k]);
      }
      return node;
    }
    return node;
  };
  await walk(state);
  if(moved) renderAll();
  return { moved, total };
}

    if(!opts.skipPrecheck){
      try{
        const cur = await withTimeout(sb.from(sbTable()).select('*').eq('id', SB_ID).maybeSingle(), 8000);
        if(!cur.error) curRow = cur.data || null;
      }catch(e){ console.warn('棰勮浜戠鏃х増鏈け璐ワ紙涓嶅奖鍝嶄繚瀛橈級锛?, (e && e.message) || e); }
      if(curRow && curRow[SB_COL_DATA]){
        try{
          await withTimeout(sb.from(sbTable()).upsert({ id: SB_BACKUP_ID, [SB_COL_DATA]: curRow[SB_COL_DATA], [SB_COL_PATCHES]: curRow[SB_COL_PATCHES] || [], updated_at: curRow.updated_at }, { onConflict:'id' }), 20000);
        }catch(e){ console.warn('鍐欏叆澶囦唤琛屽け璐ワ紙涓嶅奖鍝嶄繚瀛橈級锛?, (e && e.message) || e); }
      }

    /* 鐪熸鍐欏叆锛氬皬璇锋眰绋冲畾锛涘ぇ璇锋眰鍙兘鎸備綇 鈫?閲嶈瘯鍑犳 */
    const row = { id: SB_ID };
    row[SB_COL_DATA] = JSON.parse(JSON.stringify(state));
    row[SB_COL_PATCHES] = JSON.parse(JSON.stringify(patches));
    row.updated_at = new Date().toISOString();
    let stamp = null, lastErr = null;
    for(let attempt = 0; attempt < 3; attempt++){
      try{
        const { data, error } = await withTimeout(sb.from(sbTable()).upsert(row, { onConflict:'id' }).select('updated_at'), 25000);
        if(error) throw error;
        stamp = Array.isArray(data) && data[0] ? data[0].updated_at : row.updated_at;
        break;
      }catch(e){
        lastErr = e;
        if(attempt < 2){ setCloudStatus('working', '淇濆瓨閲嶈瘯涓紙' + (attempt + 2) + '/3锛夆€?); await new Promise(r => setTimeout(r, 1800)); }
      }
    }
    if(!stamp) throw (lastErr || new Error('淇濆瓨澶辫触'));
    lastCloudStamp = stamp; /* 璁颁綇鑷繁鍐欑殑鐗堟湰锛岄伩鍏嶈疆璇㈡妸鑷繁鍒氬瓨鐨勫唴瀹瑰啀濂椾竴閬?*/
    cloudOk = true;
    saveCloudCache(state, patches, stamp);   /* 淇濆瓨鎴愬姛涔熷埛鏂版湰鍦扮紦瀛?*/
    /* 濡傛灉瑕嗙洊鎺夌殑鏄瘮鏈〉鏇存柊鐨勪竴鐗堬紝鏄庣‘鍛婄煡锛堝凡鑷姩澶囦唤锛屽彲鎵惧洖锛?*/
    if(curRow && curRow.updated_at && opts.baseStamp && curRow.updated_at !== opts.baseStamp){
      toast('宸蹭繚瀛樺埌浜戠锛堣鐩栦簡杈冩柊鐨勪竴鐗堬紝鍙湪銆屼簯鍚屾璁剧疆 鈫?鎭㈠浜戠涓婁竴鐗堛€嶆壘鍥烇級');
    }
    return true;
  }catch(e){
    cloudOk = false;
    console.warn('浜戜繚瀛樺け璐?, e);
    const msg = (e && e.message) || '';
    if(/row.level security/i.test(msg)) toast('浜戜繚瀛樿鎷掔粷锛氳鍦?Supabase 鍚庡彴鎶婅琛ㄥ啓鏉冮檺锛圧LS锛夋斁寮€锛屾垨鍏堝湪銆屼簯鍚屾璁剧疆銆嶉噷鐧诲綍');
    else toast('浜戜繚瀛樺け璐ワ紝宸叉殏鏃堕€€鍥炴湰鍦颁繚瀛橈細' + msg);
    return false;
  }
}
function subscribeCloud(){
  if(sbChannel){ sb.removeChannel(sbChannel); sbChannel = null; }
  if(!sbConfigured()) return;
  try{
    sbChannel = sb.channel('fupo-sync')
      .on('postgres_changes', { event:'*', schema:'public', table:sbTable(), filter:'id=eq.' + SB_ID }, payload => {
        const row = payload.new || {};
        const d = row[SB_COL_DATA];
        if(!d) return;
        try{
          const st = (typeof d === 'string') ? JSON.parse(d) : d;
          if(!st || !st.meta || !st.worlds) return;
          if(editMode){
            /* 姝ｅ湪缂栬緫鏃跺厛涓嶈鐩栵紝绛夐€€鍑虹紪杈戝啀杞藉叆锛岄伩鍏嶆墦鏂緭鍏?*/
            pendingCloudState = st;
            pendingCloudPatches = Array.isArray(row[SB_COL_PATCHES]) ? row[SB_COL_PATCHES] : null;
            toast('浜戠鏈夋柊鍐呭锛岄€€鍑虹紪杈戝悗浼氳嚜鍔ㄨ浇鍏?);
            return;
          }
          applyState(st);
          if(Array.isArray(row[SB_COL_PATCHES])) patches = row[SB_COL_PATCHES];
          if(row.updated_at) lastCloudStamp = row.updated_at;
          applyPatches(); renderAll(); reloadMusicKeepState();
          toast('宸?浠?浜?绔?鍚?姝?鏈€ 鏂?鍐?瀹?);
        }catch(err){ console.warn('浜戠鏁版嵁瑙ｆ瀽澶辫触', err); }
      })
      .subscribe((status, err) => {
        sbStatus = status;
        console.log('realtime:', status, err || '');
        updateRtState();
        if(status === 'SUBSCRIBED'){ stopCloudPoll(); }
        else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){ startCloudPoll(); }
      });
  }catch(e){ console.warn('瀹炴椂璁㈤槄澶辫触', e); startCloudPoll(); }
}

function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(text){
  if(!text) return '';
  return String(text).trim().split(/\n{2,}/).map(p=>{
    const t = p.trim();
    const only = t.match(/^!\[(.*?)\]\((.*?)\)$/);
    if(only) return `<figure class="rich-img"><img src="${esc(only[2])}" alt="${esc(only[1])}" loading="lazy">${only[1]?`<figcaption>${esc(only[1])}</figcaption>`:''}</figure>`;
    let html = esc(p);
    html = html.replace(/!\[(.*?)\]\((.*?)\)/g,(m,alt,url)=>`<img src="${url}" alt="${alt}" class="inline-img" loading="lazy">`);
    html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    return `<p>${html}</p>`;
  }).join('');
}
function plain(text,n){
  if(!text) return '';
  const s = String(text).replace(/!\[(.*?)\]\((.*?)\)/g,'$1').replace(/\*\*/g,'').replace(/\n+/g,' ').trim();
  return n ? s.slice(0,n)+(s.length>n?'鈥?:'') : s;
}
function cssUrl(u){return 'url("'+String(u).replace(/["\\\n\r]/g,ch=>'\\'+ch)+'")'}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400)},1800);
}
function fmtTime(sec){
  if(!isFinite(sec)||sec<0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m+':'+(s<10?'0':'')+s;
}
/* UTF-8 瀹夊叏 base64 */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* 鍚屾鐮侊細鏈湴 base64 鍥剧墖鍗曠嫭鎵撳寘 */
function extractImages(obj){
  const bag = {};
  const repl = v => (typeof v === 'string' && v.startsWith('data:image/')) ? (bag['k'+Object.keys(bag).length] = v, '@@img:'+ (Object.keys(bag).length-1)) : v;
  const walk = o => {
    if(Array.isArray(o)) return o.map(walk);
    if(o && typeof o === 'object'){ const r = {}; for(const k in o) r[k] = walk(o[k]); return r; }
    return repl(o);
  };
  return { clean: walk(obj), bag };
}
function restoreImages(obj, bag){
  const walk = o => {
    if(Array.isArray(o)) return o.map(walk);
    if(o && typeof o === 'object'){ const r = {}; for(const k in o) r[k] = walk(o[k]); return r; }
    if(typeof o === 'string' && o.startsWith('@@img:')) return bag[o.slice(6)] || '';
    return o;
  };
  return walk(obj);
}

function applyState(next){

  Object.assign(state, n);

}
function doUndo(){

  applyState(JSON.parse(undoStack.pop()));

  toast('宸?鎾?閿€');
}

   鐘舵€佺鐞嗭紙鍚棫鏁版嵁鑷姩杩佺Щ鍒般€岃〃灞?涓婂彜銆嶇嫭绔嬬粨鏋勶級

function normMusic(m){
  const r = { volume: (m && typeof m === 'object' && typeof m.volume === 'number') ? m.volume : 60, cur: 0, tracks: [] };
  if(m && typeof m === 'object'){
    if(Array.isArray(m.tracks)){
      r.volume = (typeof m.volume === 'number') ? m.volume : r.volume;
      r.cur = Math.max(0, Math.min(Number(m.cur) || 0, Math.max(m.tracks.length - 1, 0)));
      r.tracks = m.tracks.filter(t => t && typeof t === 'object' && (t.url || t.localId)).map((t, i) => ({ id: t.id || ('t' + i), type: t.type || (t.localId ? 'local' : 'url'), url: t.url || '', localId: t.localId || '', title: t.title || '' }));
    }else if(m.url || m.localId){
      r.tracks = [{ id:'t1', type: m.type || (m.localId ? 'local' : 'url'), url: m.url || '', localId: m.localId || '', title: m.title || '' }];
    }
  }
  return r;
}
function normalize(d){
  if(!d || typeof d !== 'object') return null;
  d.meta = (d.meta && typeof d.meta === 'object') ? d.meta : {};
  if(!d.meta.gate || typeof d.meta.gate !== 'object') d.meta.gate = { enabled:true, sub:"", title:"", tip:"", btn:"鍏?鐣?, note:"" };
  if(!d.meta.abyssEntry || typeof d.meta.abyssEntry !== 'object') d.meta.abyssEntry = { label:"涓婂彜鍔涢噺", sub:"鐐?姝?鎻?寮€ 鍙?涓€ 灞? };
  if(typeof d.meta.abyssCover !== 'string') d.meta.abyssCover = d.meta.cover || '';
  if(typeof d.meta.abyssLogo !== 'string') d.meta.abyssLogo = d.meta.logo || '';
  /* 鍔ㄦ€佽儗鏅紙钀藉彾锛夎缃?*/
  if(!d.meta.bgEffect || typeof d.meta.bgEffect !== 'object') d.meta.bgEffect = { enabled: true, density: 'normal' };
  if(typeof d.meta.bgEffect.enabled !== 'boolean') d.meta.bgEffect.enabled = true;
  if(!['off','light','normal','rich'].includes(d.meta.bgEffect.density)) d.meta.bgEffect.density = 'normal';

  d.meta.music = normMusic(d.meta.music);
  if(!d.meta.abyssMusic || typeof d.meta.abyssMusic !== 'object' || (!Array.isArray(d.meta.abyssMusic.tracks) && !d.meta.abyssMusic.url && !d.meta.abyssMusic.localId)){
    /* 鏃ф暟鎹細涓婂彜闊充箰娌跨敤琛ㄥ眰鐨勪竴浠藉壇鏈紝涔嬪悗鍚勮嚜鐙珛 */
    d.meta.abyssMusic = clone(d.meta.music);
  }else{
    d.meta.abyssMusic = normMusic(d.meta.abyssMusic);
  }

  if(!d.worlds || !d.worlds.surface || !d.worlds.abyss){
    const surfaceSections = Array.isArray(d.sections) ? d.sections : [];
    d.worlds = {
      surface:{
        sections: stripAbyssFields(surfaceSections),
        characters: Array.isArray(d.characters) ? clone(d.characters) : [],
        timeline: Array.isArray(d.timeline) ? clone(d.timeline) : [],
        stories: Array.isArray(d.stories) ? clone(d.stories) : []
      },
      abyss:{
        sections: buildAbyssSections(surfaceSections),
        characters: Array.isArray(d.characters) ? clone(d.characters) : [],
        timeline: Array.isArray(d.timeline) ? clone(d.timeline) : [],
        stories: Array.isArray(d.stories) ? clone(d.stories) : []
      }
    };
    delete d.sections; delete d.characters; delete d.timeline; delete d.stories;
  }
  ['surface','abyss'].forEach(rk => {
    const w = d.worlds[rk];
    if(!Array.isArray(w.sections)) w.sections = [];
    if(!Array.isArray(w.characters)) w.characters = [];
    if(!Array.isArray(w.timeline)) w.timeline = [];
    if(!Array.isArray(w.stories)) w.stories = [];
    w.sections = w.sections.map(s => {
      if(!s || typeof s !== 'object') return { id: uid(), icon:'鉁?, title:'鏈懡鍚?, keywords:'', entries:[] };
      if(!Array.isArray(s.entries)){
        return { id: s.id || uid(), icon: s.icon || '鉁?, title: s.title || '鏈懡鍚?, keywords: s.keywords || '',
          entries: s.content ? [{ id: uid(), title: s.title || '鏉＄洰', keywords: s.keywords || '', content: s.content }] : [] };
      }
      s.entries = s.entries.map(e => (e && typeof e === 'object') ? e : { id: uid(), title:'鏈懡鍚?, content:'' });
      return s;
    });
    w.characters = w.characters.map(c => { if(!Array.isArray(c.relations)) c.relations = []; if(!Array.isArray(c.tags)) c.tags = []; return c; });
    w.timeline = w.timeline.filter(t => t && typeof t === 'object');
    w.stories = w.stories.filter(s => s && typeof s === 'object');
    if(rk === 'surface'){
      w.sections.forEach(sec => { delete sec.abyssTitle; delete sec.abyssIcon; (sec.entries||[]).forEach(e => { delete e.abyssTitle; delete e.abyssContent; }); });
    }
  });
  return d;
}

function _doSave(){
  if(sbConfigured()){
    try{
      localStorage.setItem(LS_DRAFT, JSON.stringify({ savedAt: Date.now(), baseStamp: lastCloudStamp, state, patches }));
    }catch(e){}
    cloudSave({ baseStamp: lastCloudStamp }).then(ok => { if(ok) clearDraft(); updateDraftBanner(); }).catch(()=>{});

  }
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    return true;

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME = 'fupo-media-db';
const DB_STORE = 'audio';
const SNAP_STORE = 'snapshots';

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      if(!db.objectStoreNames.contains(SNAP_STORE)) db.createObjectStore(SNAP_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(store, key, val){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGet(store, key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDel(store, key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbKeys(store){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAllKeys();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

   姣忔棩蹇収
   ============================================================ */
async function saveSnapshot(){
  try{
    const today = new Date().toISOString().slice(0,10);
    const existing = await dbGet(SNAP_STORE, today);
    if(!existing){
      await dbPut(SNAP_STORE, today, { ts: Date.now(), data: JSON.stringify(state) });
    }
    const cutoff = Date.now() - SNAPSHOT_KEEP_DAYS * 86400000;
    const keys = await dbKeys(SNAP_STORE);
    for(const k of keys){
      const snap = await dbGet(SNAP_STORE, k);
      if(snap && snap.ts < cutoff) await dbDel(SNAP_STORE, k);
    }
  }catch(e){ console.warn('蹇収澶辫触', e); }
}

let activeUndo = null;
function clearUndoToast(){
  if(!activeUndo) return;
  if(activeUndo.timer) clearInterval(activeUndo.timer);
  if(activeUndo.el && activeUndo.el.parentNode){
    activeUndo.el.classList.remove('show');
    const el = activeUndo.el;
    setTimeout(() => el.remove(), 400);
  }
  activeUndo = null;
}
function showUndoToast(msg, undoFn){
  clearUndoToast();
  const t = document.createElement('div');
  t.className = 'toast undo-toast';
  t.innerHTML = `<span class="undo-msg"></span><button class="undo-btn" type="button">鎾?鍥?/button><span class="undo-timer">${UNDO_SECONDS}</span>`;
  t.querySelector('.undo-msg').textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));

  let remain = UNDO_SECONDS;
  const timerEl = t.querySelector('.undo-timer');
  const timer = setInterval(() => {
    remain--;
    timerEl.textContent = remain;
    if(remain <= 0){
      clearInterval(timer);
      if(activeUndo && activeUndo.el === t){
        t.classList.remove('show');
        setTimeout(() => t.remove(), 400);
        activeUndo = null;
      }
    }
  }, 1000);

  t.querySelector('.undo-btn').addEventListener('click', () => {
    clearInterval(timer);
    try{ undoFn(); }catch(e){ console.warn(e); }
    t.classList.remove('show');
    setTimeout(() => t.remove(), 400);
    if(activeUndo && activeUndo.el === t) activeUndo = null;
    toast('宸?鎾?鍥?);
  });
  activeUndo = { el: t, timer };
}

function mergeContent(data){
  if(data.meta) Object.assign(state.meta, data.meta);
  const target = data.realm === 'abyss' ? state.worlds.abyss : state.worlds.surface;
  ['sections','characters','timeline','stories'].forEach(key => {
    if(!Array.isArray(data[key])) return;
    data[key].forEach(item => {
      if(!item.id) item.id = uid();
      const existing = target[key].find(x => x.id === item.id);
      if(existing) Object.assign(existing, item);
      else target[key].push(item);
    });
  });
  _doSave();
}
function applyPatches(){
  const styleBox = document.getElementById('patch-styles');
  while(styleBox.firstChild) styleBox.removeChild(styleBox.firstChild);
  const jsBox = document.getElementById('patch-js');
  jsBox.querySelectorAll('script').forEach(s => s.remove());
  window.__patchErrors = {};

  patches.filter(p => p.enabled).forEach(p => {
    p.error = '';
    try{
      if(p.type === 'style'){
        const s = document.createElement('style');
        s.textContent = p.code;
        styleBox.appendChild(s);
      }else if(p.type === 'content'){
        const data = JSON.parse(p.code);
        mergeContent(data);
      }else if(p.type === 'script'){
        const s = document.createElement('script');
        s.textContent = `(function(){try{${p.code}\n}catch(e){console.error('琛ヤ竵[' + ${JSON.stringify(p.name || '')} + ']鍑洪敊:',e);window.__patchErrors['${p.id}']=e.message;}})();`;
        jsBox.appendChild(s);
        setTimeout(() => {
          if(window.__patchErrors && window.__patchErrors[p.id]) p.error = window.__patchErrors[p.id];
        }, 100);
      }
    }catch(e){
      p.error = e.message;
    }
  });
  savePatches();
  if(patches.some(p => p.error)){
    setTimeout(() => { if(patches.some(p => p.error) && !modalRoot.innerHTML) openPatchManager(); }, 0);
  }
}

let richIO = null;
function bindRichImgReveal(){
  if(richIO) richIO.disconnect();
  const targets = document.querySelectorAll('.rich-img');
  if(!targets.length) return;
  const show = el => {
    const img = el.querySelector('img');
    if(!img || (img.complete && img.naturalWidth > 0)) el.classList.add('in');
    else{ img.addEventListener('load', () => el.classList.add('in'), { once:true }); img.addEventListener('error', () => el.classList.add('in'), { once:true }); }
  };
  if(!('IntersectionObserver' in window)){ targets.forEach(show); return; }
  richIO = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting){ show(en.target); richIO.unobserve(en.target); } });
  }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
  targets.forEach(el => richIO.observe(el));
}

/* ============================================================
   鍏崇郴缃戯紙鎸夊綋鍓嶇晫闈㈢殑浜虹墿锛?   ============================================================ */
const GRAPH_W = 680, GRAPH_H = 460;
let graphWinHandlers = null;
function clearGraphWinHandlers(){
  if(!graphWinHandlers) return;
  window.removeEventListener('mousemove', graphWinHandlers.move);
  window.removeEventListener('touchmove', graphWinHandlers.move);
  window.removeEventListener('mouseup', graphWinHandlers.up);
  window.removeEventListener('touchend', graphWinHandlers.up);
  graphWinHandlers = null;
}
function renderRelationGraph(){
  const wrap = document.getElementById('relation-graph');
  if(!wrap) return;
  clearGraphWinHandlers();
  const chars = W().characters;
  if(!chars.length){ wrap.innerHTML = ''; return; }
  const cx = GRAPH_W / 2, cy = GRAPH_H / 2;
  const R = Math.min(GRAPH_W, GRAPH_H) * 0.31;
  chars.forEach((c, i) => {
    if(typeof c._x !== 'number' || typeof c._y !== 'number'){
      if(chars.length === 1){ c._x = cx; c._y = cy; }
      else{
        const a = (i / chars.length) * Math.PI * 2 - Math.PI / 2;
        c._x = cx + R * Math.cos(a);
        c._y = cy + R * Math.sin(a);
      }
    }
  });
  const seen = new Set();
  const lines = [];
  chars.forEach(c => {
    (c.relations || []).forEach(r => {
      const t = chars.find(x => x.id === r.target);
      if(!t) return;
      const key = [c.id, t.id].sort().join('|');
      if(seen.has(key)) return;
      seen.add(key);
      lines.push({ from: c, to: t, label: r.label || '' });
    });
  });
  const clipId = 'avatarClip_' + uid();
  let svg = `<svg class="relation-svg" viewBox="0 0 ${GRAPH_W} ${GRAPH_H}" preserveAspectRatio="xMidYMid meet">`;
  svg += `<defs><clipPath id="${clipId}"><circle r="26" cx="0" cy="0"/></clipPath></defs>`;
  lines.forEach(l => {
    svg += `<line class="rel-line" data-a="${l.from.id}" data-b="${l.to.id}" x1="${l.from._x}" y1="${l.from._y}" x2="${l.to._x}" y2="${l.to._y}"/>`;
    if(l.label){
      const mx = (l.from._x + l.to._x) / 2, my = (l.from._y + l.to._y) / 2;
      svg += `<text class="rel-label" data-a="${l.from.id}" data-b="${l.to.id}" x="${mx}" y="${my}" text-anchor="middle">${esc(l.label)}</text>`;
    }
  });
  chars.forEach(c => {
    const name = esc(c.name || '锛?);
    const initial = esc((c.name || '锛?).slice(0, 1));
    svg += `<g class="rel-node" data-id="${c.id}" transform="translate(${c._x},${c._y})">
      <circle r="30"/>
      ${c.avatar
        ? `<image href="${esc(c.avatar)}" x="-26" y="-26" width="52" height="52" clip-path="url(#${clipId})" preserveAspectRatio="xMidYMid slice"/>`
        : `<text class="rel-node-char" text-anchor="middle" dy=".35em">${initial}</text>`}
      <text class="rel-node-name" y="50" text-anchor="middle">${name}</text>
    </g>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
  bindGraphEvents(wrap.querySelector('svg'));
}
function bindGraphEvents(svg){
  if(!svg) return;
  const chars = W().characters;
  svg.querySelectorAll('.rel-node').forEach(node => {
    const id = node.dataset.id;
    node.addEventListener('mouseenter', () => {
      svg.querySelectorAll('.rel-line').forEach(l => l.classList.toggle('active', l.dataset.a === id || l.dataset.b === id));
      svg.querySelectorAll('.rel-label').forEach(l => l.classList.toggle('active', l.dataset.a === id || l.dataset.b === id));
    });
    node.addEventListener('mouseleave', () => svg.querySelectorAll('.rel-line, .rel-label').forEach(l => l.classList.remove('active')));
    node.addEventListener('click', () => { if(node._dragged){ node._dragged = false; return; } openCharacter(id); });
  });
  const getPt = e => {
    const pt = svg.createSVGPoint();
    pt.x = e.touches ? e.touches[0].clientX : e.clientX;
    pt.y = e.touches ? e.touches[0].clientY : e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  let active = null;
  svg.querySelectorAll('.rel-node').forEach(node => {
    const id = node.dataset.id;
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    const down = e => {
      const c = chars.find(x => x.id === id);
      if(!c) return;
      dragging = true; node._dragged = false;
      svg.classList.add('dragging');
      const p = getPt(e);
      sx = p.x; sy = p.y; ox = c._x; oy = c._y;
      active = { node };
      e.preventDefault();
    };
    const move = e => {
      if(!dragging || !node.isConnected) return;
      const p = getPt(e);
      const c = chars.find(x => x.id === id);
      if(!c) return;
      const dx = p.x - sx, dy = p.y - sy;
      if(Math.abs(dx) + Math.abs(dy) > 3) node._dragged = true;
      c._x = Math.max(40, Math.min(GRAPH_W - 40, ox + dx));
      c._y = Math.max(40, Math.min(GRAPH_H - 40, oy + dy));
      updateGraphPositions(svg);
      e.preventDefault();
    };
    const up = () => { if(!dragging) return; dragging = false; svg.classList.remove('dragging'); _doSave(); };
    node.addEventListener('mousedown', down);
    node.addEventListener('touchstart', down, { passive: false });
    node.__move = move;
    node.__up = up;
  });
  if(!graphWinHandlers){
    const wMove = e => { if(active && active.node && active.node.__move) active.node.__move(e); };
    const wUp = () => { svg.querySelectorAll('.rel-node').forEach(n => { if(n.__up) n.__up(); }); };
    graphWinHandlers = { move: wMove, up: wUp };
    window.addEventListener('mousemove', wMove);
    window.addEventListener('touchmove', wMove, { passive:false });
    window.addEventListener('mouseup', wUp);
    window.addEventListener('touchend', wUp);
  }
}
function updateGraphPositions(svg){
  const chars = W().characters;
  svg.querySelectorAll('.rel-node').forEach(node => {
    const c = chars.find(x => x.id === node.dataset.id);
    if(c) node.setAttribute('transform', `translate(${c._x},${c._y})`);
  });
  svg.querySelectorAll('.rel-line').forEach(l => {
    const a = chars.find(x => x.id === l.dataset.a);
    const b = chars.find(x => x.id === l.dataset.b);
    if(a && b){
      l.setAttribute('x1', a._x); l.setAttribute('y1', a._y);
      l.setAttribute('x2', b._x); l.setAttribute('y2', b._y);
    }
  });
  svg.querySelectorAll('.rel-label').forEach(t => {
    const a = chars.find(x => x.id === t.dataset.a);
    const b = chars.find(x => x.id === t.dataset.b);
    if(a && b){
      t.setAttribute('x', (a._x + b._x) / 2);
      t.setAttribute('y', (a._y + b._y) / 2);
    }
  });
}

async function imageUrlFor(file){

  return dataUrl;

async function imageMarkdownFor(file){
  /* 鏂囦欢鍚嶅仛瀹夊叏澶勭悊锛氬幓鎺変細鐮村潖 markdown 鐨勫瓧绗?*/
  const name = String(file.name || 'image').replace(/\.[^.]+$/, '').replace(/[\[\]()"']/g, '_').slice(0, 60) || 'image';
  const src = await imageUrlFor(file);
  return `![${name}](${src})`;
}
async function insertImageAtCursor(ta, file){
  if(!file || !String(file.type || '').startsWith('image/')) return;
  const md = await imageMarkdownFor(file);
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const insert = (before && !before.endsWith('\n') ? '\n\n' : '') + md + (after && !after.startsWith('\n') ? '\n\n' : '');
  ta.value = before + insert + after;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + insert.length;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

function bindRichImgRevealInModal(){
  const targets = modalRoot.querySelectorAll('.rich-img');
  if(!targets.length) return;
  const show = el => {
    const img = el.querySelector('img');
    if(!img || (img.complete && img.naturalWidth > 0)) el.classList.add('in');
    else{ img.addEventListener('load', () => el.classList.add('in'), { once:true }); img.addEventListener('error', () => el.classList.add('in'), { once:true }); }
  };
  if(!('IntersectionObserver' in window)){ targets.forEach(show); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting){ show(en.target); io.unobserve(en.target); } });
  }, { threshold: 0.05 });
  targets.forEach(el => io.observe(el));
}

/* ============================================================
   鏅鸿兘鍥剧墖鍘嬬缉锛堜笂浼犲浘鐗囪嚜鍔ㄥ帇灏忥級
   ============================================================ */
function compressImage(file){
  return new Promise(resolve => {
    const KB = 1024, size = file.size;
    const passthrough = v => {
      const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.readAsDataURL(v);
    };
    if(size < 400 * KB) return passthrough(file);
    if(file.type === 'image/gif' || file.type === 'image/svg+xml') return passthrough(file);
    const maxSize = size < 1500 * KB ? 1800 : 1600;
    const quality = size < 1500 * KB ? 0.9 : 0.85;
    const isPNG = file.type === 'image/png';
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        let needResize = false;
        if(width > maxSize || height > maxSize){
          needResize = true;
          if(width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
          else{ width = Math.round(width * maxSize / height); height = maxSize; }
        }
        if(!needResize && size < 900 * KB){ resolve(fr.result); return; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        const out = isPNG ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality);
        if(out.length > fr.result.length) resolve(fr.result);
        else resolve(out);
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

modalRoot.addEventListener('change', async e => {
  const inp = e.target;
  if(inp.type !== 'file' || !inp.files || !inp.files[0]) return;
  if(inp.id === 'music-file-input') return;
  if(inp.closest('.insert-img-btn')) return;
  const file = inp.files[0];
  if(!file.type.startsWith('image/')) return;
  if(file.size > 5 * 1024 * 1024){
    if(!confirm('鍥剧墖杈冨ぇ锛堣秴杩?5MB锛夛紝缁х画鍚楋紵')) { inp.value = ''; return; }
  }
  const wrap = inp.closest('.field');
  if(!wrap) return;
  const text = wrap.querySelector('input[type=text]');
  const pv = wrap.querySelector('.img-preview');
  const src = await imageUrlFor(file);
  if(text){ text.value = src; text.dispatchEvent(new Event('input', { bubbles: true })); }
  if(pv) pv.style.backgroundImage = cssUrl(src);
  inp.value = '';
});
modalRoot.addEventListener('input', e => {
  if(e.target.matches('.img-row input[type=text]')){
    const pv = e.target.closest('.img-row').querySelector('.img-preview');
    const v = e.target.value.trim();
    pv.style.backgroundImage = v ? cssUrl(v) : 'none';
  }
});

const STOP_WORDS = ['鏄粈涔?,'浠€涔堟槸','鍦ㄥ摢閲?,'鍦ㄥ摢','濡備綍','鎬庝箞','鎬庢牱','璇烽棶','鍛婅瘔','缁欐垜','甯垜','杩欎釜','閭ｄ釜','涓€涓?,'鍏充簬','浠嬬粛','璁茶','璇磋','鑳藉惁','鍙互','鏈夋病鏈?,'鍝簺','鍝釜','涓轰粈涔?,'澶氬皯','鏃跺€?,'鍝噷','浠€涔?,'鍝?,'璋?,'鐨?,'鍚?,'鍛?,'鍟?,'浜?,'鏄?,'鏈?,'鍜?,'涓?,'鍙?,'璇?,'闂?,'涓?,'鎴?,'浣?,'浠?,'濂?,'瀹?,'浠?,'杩?,'閭?,'鐫€','杩?,'浼?,'瑕?,'鑳?];
function extractTerms(q){
  let s = String(q || '').toLowerCase();
  s = s.replace(/[锛?锛?銆傦紝,銆侊紱;锛?""''銆屻€嶃€庛€忥紙锛?)\[\]銆愩€?>銆娿€媬路\s]+/g, ' ');
  [...STOP_WORDS].sort((a,b)=>b.length-a.length).forEach(w => { s = s.split(w).join(' '); });
  const raw = s.split(/\s+/).filter(Boolean);
  const terms = new Set();
  raw.forEach(w => {
    terms.add(w);
    if(w.length >= 3 && /^[\u4e00-\u9fa5]+$/.test(w)){
      for(let i=0;i<w.length-1;i++) terms.add(w.slice(i, i+2));
    }
  });
  return Array.from(terms).filter(t => t.length >= 1);
}
function buildIndex(){
  const items = [];
  W().sections.forEach(s => {
    (s.entries || []).forEach(e => {
      items.push({
        type:'section', sectionId: s.id, entryId: e.id,
        sectionTitle: s.title, entryTitle: e.title, title: e.title,
        text: e.content || '',
        keywords: [s.keywords || '', e.keywords || '', s.title, e.title].join(' ')
      });
    });
  });
  if(document.getElementById('search-all')?.checked){
    W().characters.forEach(c => {
      items.push({ type:'character', sectionId:'chars', entryId:c.id,
        sectionTitle:'濡栦紬', entryTitle:c.name, title:c.name,
        text: (c.desc || '') + ' ' + (c.tags||[]).join(' '), keywords: c.keywords || '' });
    });
    W().timeline.forEach(t => {
      items.push({ type:'timeline', sectionId:'timeline', entryId:t.id,
        sectionTitle:'绾勾', entryTitle:t.title, title:t.title,
        text: t.desc || '', keywords: t.keywords || '' });
    });
    W().stories.forEach(s => {
      items.push({ type:'story', sectionId:'stories', entryId:s.id,
        sectionTitle:'鍗峰笝', entryTitle:s.title, title:s.title,
        text: (s.summary||'') + ' ' + (s.content||''), keywords: s.keywords || '' });
    });
  }
  return items;
}
function scoreItem(item, terms, q){
  const title = (item.title || '').toLowerCase();
  const text = (item.text || '').toLowerCase();
  const kw = (item.keywords || '').toLowerCase();
  let score = 0;
  const ql = String(q || '').toLowerCase();
  if(ql && ql.length >= 2){
    if(kw.includes(ql)) score += 80;
    if(title.includes(ql)) score += 60;
    if(text.includes(ql)) score += 45;
  }
  terms.forEach(t => {
    if(!t) return;
    const w = t.length >= 2 ? 1 : 0.35;
    let cnt = 0, idx = kw.indexOf(t);
    while(idx > -1 && cnt < 4){ cnt++; idx = kw.indexOf(t, idx + 1); }
    score += cnt * 12 * w;
    if(title.includes(t)) score += 10 * w;
    cnt = 0; idx = text.indexOf(t);
    while(idx > -1 && cnt < 8){ cnt++; idx = text.indexOf(t, idx + 1); }
    score += cnt * 2.5 * w;
  });
  return score;
}
function makeSnippet(text, q, terms){
  if(!text) return '';
  const t = text.replace(/!\[(.*?)\]\((.*?)\)/g, '$1').replace(/\n+/g, ' ').trim();
  const lower = t.toLowerCase();
  const ql = String(q || '').toLowerCase();
  let pos = -1;
  if(ql && ql.length >= 2) pos = lower.indexOf(ql);
  if(pos < 0){
    [...terms].sort((a,b)=>b.length-a.length).forEach(tm => {
      if(pos > -1) return;
      pos = lower.indexOf(tm);
    });
  }
  if(pos < 0) return t.slice(0, 90) + (t.length > 90 ? '鈥? : '');
  const start = Math.max(0, pos - 28);
  const end = Math.min(t.length, pos + 78);
  return (start > 0 ? '鈥? : '') + t.slice(start, end) + (end < t.length ? '鈥? : '');
}
function highlight(text, terms, q){
  const all = Array.from(new Set([...terms, q].filter(Boolean))).filter(t => t.length >= 1);
  if(!all.length) return esc(text);
  all.sort((a,b)=>b.length-a.length);
  const pattern = all.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  let re; try{ re = new RegExp(pattern, 'gi'); }catch(e){ return esc(text); }
  let result = '', last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) result += esc(text.slice(last, m.index));
    result += '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
    if(m[0].length === 0) re.lastIndex++;
  }
  if(last < text.length) result += esc(text.slice(last));
  return result;
}
const searchPanel = document.getElementById('search-panel');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchHint = document.getElementById('search-hint');
function openSearch(){
  searchPanel.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeDrawer();
  setTimeout(() => searchInput.focus(), 220);
}
function closeSearch(){
  searchPanel.classList.remove('open');
  document.body.style.overflow = '';
  searchInput.value = '';
  searchResults.innerHTML = '';
  searchHint.style.display = '';
}
function performSearch(query){
  const q = String(query || '').trim();
  if(!q){ searchHint.style.display = ''; searchResults.innerHTML = ''; return; }
  searchHint.style.display = 'none';
  const terms = extractTerms(q);
  const items = buildIndex();
  const scored = items.map(item => ({ item, score: scoreItem(item, terms, q) }))
    .filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, 12);
  if(!scored.length){
    searchResults.innerHTML = `<div class="search-empty">鏈?鎵?鍒?鐩?鍏?鍐?瀹癸紙褰撳墠鎼滅储鑼冨洿锛?{rl()}锛?/div>`;
    return;
  }
  searchResults.innerHTML = scored.map(({ item }) => {
    const sn = makeSnippet(item.text, q, terms);
    return `<button class="result-item" data-sid="${esc(item.sectionId)}" data-eid="${esc(item.entryId)}" data-type="${esc(item.type)}">
      <div class="result-head">
        <span class="result-type">${esc(item.sectionTitle)}</span>
        <span class="result-title">${esc(item.entryTitle)}</span>
      </div>
      <div class="result-snippet">${highlight(sn, terms, q)}</div>
    </button>`;
  }).join('');
}
function jumpToSection(sid, eid){
  closeSearch();
  setTimeout(() => {
    const sectionEl = document.querySelector(`.world-item[data-sid="${sid}"]`);
    if(!sectionEl) return;
    sectionEl.classList.add('open');
    setTimeout(() => {
      const entryEl = sectionEl.querySelector(`.entry[data-eid="${eid}"]`);
      if(!entryEl) return;
      entryEl.scrollIntoView({ behavior:'smooth', block:'center' });
      entryEl.classList.add('flash');
      setTimeout(() => entryEl.classList.remove('flash'), 3200);
      setTimeout(bindRichImgReveal, 200);
    }, 420);
  }, 200);
}
document.getElementById('search-open').addEventListener('click', openSearch);
document.getElementById('search-close').addEventListener('click', closeSearch);
searchPanel.addEventListener('click', e => { if(e.target === searchPanel) closeSearch(); });
searchInput.addEventListener('input', e => performSearch(e.target.value));
searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); searchResults.querySelector('.result-item')?.click(); }
});
searchResults.addEventListener('click', e => {
  const btn = e.target.closest('.result-item');
  if(!btn) return;
  const sid = btn.dataset.sid, eid = btn.dataset.eid, type = btn.dataset.type;
  if(type === 'character'){ closeSearch(); setTimeout(() => openCharacter(eid), 200); }
  else if(type === 'timeline'){ closeSearch(); setTimeout(() => openTimeline(eid), 200); }
  else if(type === 'story'){ closeSearch(); setTimeout(() => openStory(eid), 200); }
  else jumpToSection(sid, eid);
});
searchHint.addEventListener('click', e => {
  const chip = e.target.closest('[data-q]');
  if(!chip) return;
  searchInput.value = chip.dataset.q;
  performSearch(chip.dataset.q);
});
document.getElementById('search-all').addEventListener('change', () => {
  if(searchInput.value.trim()) performSearch(searchInput.value);
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); openSearch(); }
  if(e.key === 'Escape' && searchPanel.classList.contains('open')) closeSearch();
});

function renderGate(){
  const gate = document.getElementById('gate');
  if(!gate) return;
  const g = state.meta.gate || {};
  if(g.enabled === false){
    gate.classList.add('hide');
    document.body.style.overflow = '';
    setTimeout(() => { if(gate.parentNode) gate.remove(); }, 400);
    const tryPlayOnce = () => {
      musicIntent = true;
      if(musicReady && audioEl.paused) audioEl.play().catch(()=>{});
      document.removeEventListener('click', tryPlayOnce);
      document.removeEventListener('touchstart', tryPlayOnce);
    };
    document.addEventListener('click', tryPlayOnce, { once:true });
    document.addEventListener('touchstart', tryPlayOnce, { once:true });
    return;
  }
  gate.classList.remove('hide');
  gate.innerHTML = `
    <div class="gate-inner">
      ${g.sub ? `<p class="gate-sub">${esc(g.sub)}</p>` : ''}
      <h1 class="gate-title">${esc(g.title || state.meta.title || '娴瓌')}</h1>
      <div class="gate-rule"></div>
      ${g.tip ? `<p class="gate-tip">${esc(g.tip)}</p>` : ''}
      <button class="gate-btn" id="gate-btn">${esc(g.btn || '鍏?鐣?)}</button>
      ${g.note ? `<p class="gate-note">${esc(g.note)}</p>` : ''}
    </div>`;
  const gateBtn = gate.querySelector('#gate-btn');
  let entered = false;
  function enter(){
    if(entered) return;
    entered = true;
    gate.classList.add('hide');
    document.body.style.overflow = '';
    musicIntent = true;   /* 鐐广€屽叆鐣屻€? 鎯冲惉闊充箰锛氬嵆浣挎瓕鍗曡繕鍦ㄥ姞杞斤紝鍔犺浇瀹屼細鑷姩鍝嶈捣 */
    if(musicReady && audioEl.paused) audioEl.play().catch(()=>{});
    setTimeout(() => { if(gate.parentNode) gate.parentNode.removeChild(gate); }, 900);
    document.removeEventListener('keydown', gateKey);
  }
  /* 鍥炶溅涔熷彲浠ュ叆鐣?*/
  const gateKey = e => { if(e.key === 'Enter') enter(); };
  document.addEventListener('keydown', gateKey);
  if(gateBtn) gateBtn.addEventListener('click', enter);
  gate.addEventListener('click', e => { if(e.target === gate) enter(); });
  document.body.style.overflow = 'hidden';
}

const FUPO_BG = (function(){

    ['rgba(160,134,80,1)', 'rgba(176,152,96,1)'],
    ['rgba(61,90,82,1)',   'rgba(86,116,104,1)'],
    ['rgba(158,51,40,1)',  'rgba(184,86,68,1)'],
    ['rgba(120,112,84,1)', 'rgba(150,140,104,1)']
  ];
  const DARK = [
    ['rgba(201,163,92,1)', 'rgba(226,192,120,1)'],
    ['rgba(201,74,58,1)',  'rgba(226,110,92,1)'],
    ['rgba(123,169,154,1)','rgba(150,196,180,1)'],
    ['rgba(150,140,120,1)','rgba(178,168,148,1)']
  ];
  const DENSITY = { off:[0,0,0], light:[5,10,0.7], normal:[9,18,1], rich:[14,26,1.15] };
  const FPS = 30;

  let cv = null, ctx = null, sprites = [], parts = [];
  let W = 0, H = 0, DPR = 1, running = false, last = 0, spritesAbyss = null;
  let cfgKey = '', resizeTimer = null;

  const rnd = (a, b) => a + Math.random() * (b - a);

  function makeSprite(size, c1, c2){
    const pad = size * 0.9, s3 = 3;
    const c = document.createElement('canvas');
    c.width = (size + pad * 2) * s3; c.height = (size + pad * 2) * s3;
    const g = c.getContext('2d');
    g.scale(s3, s3); g.translate(pad, pad);
    const s = size;
    const leaf = () => {
      g.beginPath();
      g.moveTo(s * 0.5, 0);
      g.bezierCurveTo(s * 0.97, s * 0.26, s * 0.92, s * 0.74, s * 0.5, s);
      g.bezierCurveTo(s * 0.08, s * 0.74, s * 0.03, s * 0.26, s * 0.5, 0);
      g.closePath();
    };
    const grd = g.createLinearGradient(0, 0, s, s);
    grd.addColorStop(0, c1); grd.addColorStop(1, c2);
    const N = 14, R = size * 0.10;
    for(let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2, rr = R * (0.35 + 0.65 * ((i % 3) / 2));
      g.save(); g.translate(Math.cos(a) * rr, Math.sin(a) * rr);
      leaf(); g.globalAlpha = 0.11; g.fillStyle = grd; g.fill(); g.restore();
    }
    leaf(); g.globalAlpha = 0.55; g.fillStyle = grd; g.fill();
    g.globalAlpha = 0.18; g.strokeStyle = 'rgba(255,255,255,.9)';
    g.lineWidth = Math.max(0.6, s * 0.025);
    g.beginPath(); g.moveTo(s * 0.5, s * 0.10); g.lineTo(s * 0.5, s * 0.90); g.stroke();
    return c;
  }
  function buildSprites(isAbyss){
    const pal = isAbyss ? DARK : LIGHT;
    const sizes = isAbyss ? [12, 17, 23] : [13, 18, 25];
    sprites = [];
    for(let i = 0; i < pal.length; i++){
      for(let j = 0; j < sizes.length; j++){
        sprites.push({ img: makeSprite(sizes[j], pal[i][0], pal[i][1]), size: sizes[j], alpha: isAbyss ? 0.16 : 0.22 });
      }
    }
  }
  function resizeCanvas(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.max(1, Math.floor(W * DPR));
    cv.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if(ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
  }
  function densityCfg(){
    const m = (state.meta && state.meta.bgEffect) || {};
    const d = DENSITY[m.density] || DENSITY.normal;
    return { count: W < 820 ? d[0] : d[1], mul: d[2] };
  }
  function buildParts(){
    const dc = densityCfg();
    const isMobile = W < 820;
    let count = dc.count;
    if(!isMobile) count = Math.min(26, Math.round(count * Math.min(1.4, W / 1400 + 0.6)));
    parts = [];
    for(let i = 0; i < count; i++){
      const depth = Math.random();
      parts.push({
        x: rnd(-40, W + 40), y: rnd(-H, H),
        vy: rnd(9, 20) * (0.55 + depth * 0.9),
        amp: rnd(8, 26) * (0.5 + depth),
        sp: rnd(0.25, 0.6),
        rot: rnd(0, Math.PI * 2), vr: rnd(-0.25, 0.25),
        scale: 0.55 + depth * 0.75,
        alpha: (0.5 + depth * 0.5) * (0.75 + Math.random() * 0.5) * dc.mul,
        si: Math.floor(Math.random() * 9),
        t: rnd(0, 100)
      });
    }
  }
  /* 闂ㄥ笜鍦ㄦ椂鎶婄敾甯冩斁杩涢棬甯橀噷锛堝灚鍦ㄦ枃瀛椾笅锛夛紝閬垮厤闂ㄥ笜閫忓嚭姝ｆ枃閫犳垚"閲嶅奖" */
  function ensurePlacement(){
    const gate = document.getElementById('gate');
    const inGate = !!(gate && gate.parentNode && !gate.classList.contains('hide'));
    const want = inGate ? gate : document.body;
    if(cv.parentNode !== want){
      want.insertBefore(cv, want.firstChild);
      resizeCanvas();
    }
  }
  function frame(now){
    if(!running) return;
    requestAnimationFrame(frame);
    if(document.hidden) return;                 /* 鍚庡彴涓嶇敾 */
    if(last && now - last < 1000 / FPS) return; /* 闄愬抚 */
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
    last = now;
    ensurePlacement();
    if(!parts.length) return;
    const isAbyss = document.body.classList.contains('abyss');
    if(isAbyss !== spritesAbyss){ buildSprites(isAbyss); spritesAbyss = isAbyss; }
    ctx.clearRect(0, 0, W, H);
    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.t += dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      let x = p.x + Math.sin(p.t * p.sp) * p.amp + Math.sin(p.t * 0.17) * 12;
      if(p.y > H + 60){ p.y = -60; p.x = rnd(-40, W + 40); }
      if(x < -80) x = W + 60; else if(x > W + 80) x = -60;
      const sp = sprites[p.si % sprites.length];
      if(!sp) continue;
      const s = sp.size * p.scale * 2.1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, sp.alpha * p.alpha));
      ctx.translate(x, p.y); ctx.rotate(p.rot);
      ctx.drawImage(sp.img, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }
  function start(){
    if(running) return;
    if(!cv){
      /* 娓呮帀浠讳綍鍚?id 鐨勬畫鐣欑敾甯冿紙渚嬪鏃?鍔ㄦ€佽儗鏅?琛ヤ竵鐣欎笅鐨勶級锛岄伩鍏嶄袱濂楀姩鐢绘墦鏋?*/
      document.querySelectorAll('#' + ID).forEach(el => el.remove());
      cv = document.createElement('canvas');
      cv.id = ID;
      document.body.insertBefore(cv, document.body.firstChild);
      ctx = cv.getContext('2d', { alpha: true });
    }
    DPR = Math.min(window.devicePixelRatio || 1, W < 820 ? 2 : 2);
    resizeCanvas();
    buildSprites(document.body.classList.contains('abyss'));
    spritesAbyss = document.body.classList.contains('abyss');
    buildParts();
    running = true; last = 0;
    requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(cv && cv.parentNode) cv.parentNode.removeChild(cv);
    cv = null; ctx = null; parts = []; sprites = [];
  }
  /* 鏍规嵁璁剧疆涓庣郴缁熷亸濂斤紝鍐冲畾寮€/鍏?閲嶅缓 */
  function apply(){
    const want = !!(state.meta && state.meta.bgEffect && state.meta.bgEffect.enabled);
    let reduced = false;
    try{ reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    const key = want + '|' + reduced + '|' + ((state.meta.bgEffect || {}).density || '') + '|' + (W < 820);
    if(key === cfgKey) return;
    cfgKey = key;
    if(!want || reduced){ stop(); return; }
    start();
  }
  /* 灏哄鍙樺寲锛堝惈鎵嬫満鍦板潃鏍忎几缂╋級鈫?闃叉姈閲嶅缓 */
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(!running) return;
      const ow = W, oh = H;
      resizeCanvas();
      if(Math.abs(ow - W) > 120 || Math.abs(oh - H) > 140) buildParts();
      cfgKey = '';  /* 鍏佽閲嶆柊璇勪及锛堟í绔栧睆鍒囨崲锛?*/
      apply();
    }, 260);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) last = 0; });

  return {
    apply, stop, start,
    get running(){ return running; },
    get count(){ return parts.length; },
    setDensity(d){ if(state.meta && state.meta.bgEffect){ state.meta.bgEffect.density = d; } cfgKey = ''; apply(); }
  };
})();

  (patches || []).forEach(p => {

}

/* 鍥剧墖鐐瑰嚮鏀惧ぇ鏌ョ湅璇︽儏锛堟鏂囬噷鐨?.rich-img / .inline-img锛?*/
function openLightbox(img){
  if(!img) return;
  document.querySelectorAll('.fupo-lightbox').forEach(el => el.remove());
  const lb = document.createElement('div');
  lb.className = 'fupo-lightbox';
  const im = document.createElement('img');
  im.src = img.currentSrc || img.src;
  const cap = document.createElement('div');
  cap.className = 'lb-cap';
  cap.textContent = img.alt || '';
  const close = document.createElement('button');
  close.className = 'lb-close';
  close.textContent = '鉁?;
  close.setAttribute('aria-label', '鍏抽棴');
  lb.appendChild(im);
  if(cap.textContent) lb.appendChild(cap);
  lb.appendChild(close);
  document.body.appendChild(lb);
  const esc = e => { if(e.key === 'Escape'){ remove(); } };
  const remove = () => { lb.remove(); document.removeEventListener('keydown', esc); };
  lb.addEventListener('click', e => { if(e.target === lb || e.target === close) remove(); });
  document.addEventListener('keydown', esc);
}
document.addEventListener('click', e => {
  const img = e.target.closest ? e.target.closest('img') : null;
  if(!img) return;
  if(!(img.classList.contains('inline-img') || img.closest('.rich-img'))) return;
  openLightbox(img);
});

/* 椤堕儴浼犺緭杩涘害鏉★細pct 涓?null 鏃舵樉绀?杩涜涓?鍔ㄧ敾锛涘惁鍒欐寜鐧惧垎姣旀帹杩?*/
let transferBar = null;
function showProgress(pct, text){
  try{
    if(!transferBar){
      transferBar = document.createElement('div');
      transferBar.className = 'fupo-progress';
      transferBar.innerHTML = '<div class="bar"></div><div class="p-text"></div>';
      document.body.appendChild(transferBar);
    }
    transferBar.classList.toggle('indeterminate', pct == null);
    const bar = transferBar.querySelector('.bar');
    if(pct != null) bar.style.width = Math.max(2, Math.min(100, pct)) + '%';
    const txt = transferBar.querySelector('.p-text');
    if(text != null){ txt.textContent = text; txt.style.display = ''; }
    else txt.style.display = 'none';
  }catch(e){}
}
function hideProgress(){
  try{ if(transferBar){ transferBar.remove(); transferBar = null; } }catch(e){}
}
